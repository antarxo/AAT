<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AAT Launcher — fixed iframe 1600×768</title>
  <style>
    html,body{height:100%;margin:0;overflow:hidden;background:#000;}
    #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    #app{border:0;display:block;width:1600px;height:768px;background:transparent;}
  </style>
</head>
<body>
  <div id="wrap">
    <iframe id="app" scrolling="no"></iframe>
  </div>

  <script>
  (function(){
    const p = new URLSearchParams(location.search);
    const appParam = p.get('app') || './index.html';
    document.getElementById('app').src = new URL(appParam, location.href).href;
  })();
  </script>
</body>
</html>
