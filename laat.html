<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AAT Launcher — fixed internal viewport + COVER (center-crop)</title>
  <style>
    html,body{height:100%;margin:0;overflow:hidden;background:#000;}
    #host{position:fixed;inset:0;overflow:hidden;}
    #app{
      position:absolute;
      left:50%;
      top:50%;
      border:0;
      display:block;
      background:transparent;
      transform-origin: top left;
      will-change: transform;
    }
    #hud{
      position:fixed;left:12px;top:12px;z-index:999999;
      padding:10px 12px;border-radius:12px;
      background:rgba(20,24,32,.88);
      border:1px solid rgba(255,255,255,.14);
      color:#e7eefc;
      font:12.5px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      box-shadow:0 12px 32px rgba(0,0,0,.45);
      display:none;
      max-width:min(820px, 92vw);
      white-space:nowrap;
    }
    #hud b{font-size:13px;}
    #hud .row{display:flex;gap:10px;align-items:baseline;}
    #hud .k{opacity:.8;}
    #hud .v{font-variant-numeric:tabular-nums;}
    #msg{
      position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
      max-width:min(860px,92vw);
      background:rgba(20,24,32,.92);color:#e7eefc;
      font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      padding:16px 18px;border:1px solid rgba(255,255,255,.16);
      border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.55);
      display:none;
    }
    #msg b{display:block;margin-bottom:8px;font-size:15px;}
    #msg code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px;}
    #msg .small{opacity:.85;margin-top:10px;font-size:13px;}
  </style>
</head>
<body>
  <div id="host">
    <iframe id="app" scrolling="no"></iframe>
  </div>

  <div id="hud"></div>

  <div id="msg">
    <b>Δεν βρίσκω/δεν μπορώ να φορτώσω το app.</b>
    Το launcher προσπαθεί να φορτώσει: <code id="srcOut"></code>
    <div class="small">
      Δώσε path με <code>?app=...</code> ή όρισε <code>?dw=...</code> <code>&dh=...</code>.
    </div>
  </div>

  <script>
  (function(){
    const app  = document.getElementById('app');
    const hud  = document.getElementById('hud');
    const msg  = document.getElementById('msg');

    const p = new URLSearchParams(location.search);

    const appParam = p.get('app') || './index.html';
    document.getElementById('srcOut').textContent = appParam;
    const appURL = new URL(appParam, location.href).href;
    app.src = appURL;

    // fixed internal viewport ("design canvas")
    const DW = Math.max(1, parseFloat(p.get('dw') || '1450'));
    const DH = Math.max(1, parseFloat(p.get('dh') || '768'));

    const debugOn = p.get('debug') === '1';
    hud.style.display = debugOn ? 'block' : 'none';

    function vp(){
      const vv = window.visualViewport;
      const vw = vv ? vv.width  : (window.innerWidth  || document.documentElement.clientWidth  || 0);
      const vh = vv ? vv.height : (window.innerHeight || document.documentElement.clientHeight || 0);
      const vvs = vv ? vv.scale : 1;
      return {vw, vh, vvs};
    }

    function fit(){
      const {vw, vh, vvs} = vp();
      if(!vw || !vh) return;

      app.style.width  = DW + 'px';
      app.style.height = DH + 'px';

      // COVER: γεμίζει πάντα, με center-crop όπου χρειάζεται
      const s = Math.max(vw / DW, vh / DH);

      // center in viewport:
      // anchor at center, then translate by half design size, then scale
      app.style.transform = `translate(${-(DW/2)}px, ${-(DH/2)}px) scale(${s})`;

      if(debugOn){
        const dpr = window.devicePixelRatio || 1;
        const shownW = DW * s, shownH = DH * s;
        const cropX = Math.max(0, shownW - vw);
        const cropY = Math.max(0, shownH - vh);
        hud.innerHTML =
          `<div class="row"><b>v11 (COVER, center-crop)</b></div>` +
          `<div class="row"><span class="k">app</span><span class="v">${esc(appParam)}</span></div>` +
          `<div class="row"><span class="k">design</span><span class="v">${DW}×${DH} (AR ${(DW/DH).toFixed(4)})</span></div>` +
          `<div class="row"><span class="k">viewport</span><span class="v">${Math.round(vw)}×${Math.round(vh)} (AR ${(vw/vh).toFixed(4)})</span></div>` +
          `<div class="row"><span class="k">scale</span><span class="v">${s.toFixed(4)}</span></div>` +
          `<div class="row"><span class="k">cropping</span><span class="v">x=${Math.round(cropX)}px, y=${Math.round(cropY)}px (total)</span></div>` +
          `<div class="row"><span class="k">dpr</span><span class="v">${dpr.toFixed(2)}</span><span class="k">vv.scale</span><span class="v">${(vvs||1).toFixed(3)}</span></div>` +
          `<div class="row"><span class="k">params</span><span class="v">?dw=${DW}&dh=${DH}</span></div>`;
      }
    }

    function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    async function checkReachable(){
      try{
        const r = await fetch(appURL, {cache:'no-store'});
        msg.style.display = r.ok ? 'none' : 'block';
      }catch(e){
        msg.style.display = 'block';
      }
    }

    window.addEventListener('resize', fit, {passive:true});
    window.addEventListener('orientationchange', fit);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fit, {passive:true});

    app.addEventListener('load', ()=>{ msg.style.display='none'; fit(); });
    setTimeout(checkReachable, 600);
    setTimeout(checkReachable, 1500);

    fit();
  })();
  </script>
</body>
</html>
