<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AAT Launcher — fixed ratio w = h * (1450/768)</title>
  <style>
    html,body{height:100%;margin:0;overflow:hidden;background:#0b0f14;}
    #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    #app{border:0;display:block;background:transparent;}
    #hud{
      position:fixed;left:12px;top:12px;z-index:999999;
      padding:10px 12px;border-radius:12px;
      background:rgba(20,24,32,.88);
      border:1px solid rgba(255,255,255,.14);
      color:#e7eefc;
      font:12.5px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      box-shadow:0 12px 32px rgba(0,0,0,.45);
      display:none;
      max-width:min(640px, 92vw);
      white-space:nowrap;
    }
    #hud b{font-size:13px;}
    #hud .row{display:flex;gap:10px;align-items:baseline;}
    #hud .k{opacity:.8;}
    #hud .v{font-variant-numeric:tabular-nums;}
    #msg{
      position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
      max-width:min(860px,92vw);
      background:rgba(20,24,32,.92);color:#e7eefc;
      font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      padding:16px 18px;border:1px solid rgba(255,255,255,.16);
      border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.55);
      display:none;
    }
    #msg b{display:block;margin-bottom:8px;font-size:15px;}
    #msg code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px;}
    #msg .small{opacity:.85;margin-top:10px;font-size:13px;}
  </style>
</head>
<body>
  <div id="wrap">
    <iframe id="app" scrolling="no"></iframe>
  </div>

  <div id="hud"></div>

  <div id="msg">
    <b>Δεν βρίσκω/δεν μπορώ να φορτώσω το app.</b>
    Το launcher προσπαθεί να φορτώσει: <code id="srcOut"></code>
    <div class="small">
      Δώσε path με <code>?app=...</code> (π.χ. <code>?app=./app/index.html</code> ή <code>?app=../index.html</code>).
    </div>
  </div>

  <script>
  (function(){
    const RATIO = 1.888020833333; // 1450/768
    const app  = document.getElementById('app');
    const hud  = document.getElementById('hud');
    const msg  = document.getElementById('msg');

    const p = new URLSearchParams(location.search);
    const appParam = p.get('app') || './index.html';
    const debugOn = p.get('debug') === '1';
    hud.style.display = debugOn ? 'block' : 'none';

    document.getElementById('srcOut').textContent = appParam;

    const appURL = new URL(appParam, location.href).href;
    app.src = appURL;

    function viewport(){
      const vv = window.visualViewport;
      const vw = vv ? vv.width  : (window.innerWidth  || document.documentElement.clientWidth  || 0);
      const vh = vv ? vv.height : (window.innerHeight || document.documentElement.clientHeight || 0);
      const vvs = vv ? vv.scale : 1;
      return { vw, vh, vvs };
    }

    function fit(){
      const { vw, vh, vvs } = viewport();
      if(!vw || !vh) return;

      // Ζητούμενο: w = h * RATIO.
      // Προτεραιότητα: γεμίζουμε το ύψος. Αν δεν χωράει στο πλάτος, γεμίζουμε το πλάτος.
      let h = vh;
      let w = h * RATIO;

      if (w > vw) {
        w = vw;
        h = w / RATIO;
      }

      w = Math.floor(w);
      h = Math.floor(h);

      app.style.width = w + 'px';
      app.style.height = h + 'px';

      if (debugOn) {
        const dpr = window.devicePixelRatio || 1;
        hud.innerHTML =
          `<div class="row"><b>v8 (fixed ratio)</b></div>` +
          `<div class="row"><span class="k">ratio</span><span class="v">${RATIO.toFixed(6)} (1450/768)</span></div>` +
          `<div class="row"><span class="k">viewport</span><span class="v">${Math.round(vw)}×${Math.round(vh)} (AR ${(vw/vh).toFixed(4)})</span></div>` +
          `<div class="row"><span class="k">iframe</span><span class="v">${w}×${h} (AR ${(w/h).toFixed(4)})</span></div>` +
          `<div class="row"><span class="k">dpr</span><span class="v">${dpr.toFixed(2)}</span><span class="k">vv.scale</span><span class="v">${(vvs||1).toFixed(3)}</span></div>`;
      }
    }

    async function checkReachable(){
      try{
        const r = await fetch(appURL, { cache:'no-store' });
        msg.style.display = r.ok ? 'none' : 'block';
      } catch(e) {
        msg.style.display = 'block';
      }
    }

    window.addEventListener('resize', fit, { passive:true });
    window.addEventListener('orientationchange', fit);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fit, { passive:true });

    app.addEventListener('load', ()=>{ msg.style.display='none'; fit(); });

    setTimeout(checkReachable, 600);
    setTimeout(checkReachable, 1500);
    fit();
  })();
  </script>
</body>
</html>
