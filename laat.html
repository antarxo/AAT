<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AAT Launcher — iframe resize v6 (uses standalone baseline)</title>
  <style>
    html,body{height:100%;margin:0;overflow:hidden;background:#0b0f14;}
    #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    #app{border:0;display:block;background:transparent;}
    #hud{
      position:fixed;left:12px;top:12px;z-index:999999;
      padding:10px 12px;border-radius:12px;
      background:rgba(20,24,32,.88);
      border:1px solid rgba(255,255,255,.14);
      color:#e7eefc;
      font:12.5px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      box-shadow:0 12px 32px rgba(0,0,0,.45);
      display:none;
      max-width:min(560px, 92vw);
      white-space:nowrap;
    }
    #hud b{font-size:13px;}
    #hud .row{display:flex;gap:10px;align-items:baseline;}
    #hud .k{opacity:.8;}
    #hud .v{font-variant-numeric:tabular-nums;}
    #msg{
      position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
      max-width:min(860px,92vw);
      background:rgba(20,24,32,.92);color:#e7eefc;
      font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      padding:16px 18px;border:1px solid rgba(255,255,255,.16);
      border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.55);
      display:none;
    }
    #msg b{display:block;margin-bottom:8px;font-size:15px;}
    #msg code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px;}
    #msg .small{opacity:.85;margin-top:10px;font-size:13px;}
  </style>
</head>
<body>
  <div id="wrap">
    <iframe id="app" scrolling="no"></iframe>
  </div>

  <div id="hud"></div>

  <div id="msg">
    <b>Λείπει baseline από standalone προβολή.</b>
    Για να δείξει το iframe 1:1 όπως “κανονικά”, πρέπει πρώτα να γράψουμε baseline από σελίδα χωρίς iframe.
    <div class="small">
      Άνοιξε: <code>aat-capture-baseline.html</code> (στο ίδιο folder) και πάτα “Αποθήκευση + Άνοιγμα launcher”.
    </div>
  </div>

  <script>
  (function(){
    const KEY_W = 'AAT_BASELINE_VW_STANDALONE';
    const KEY_H = 'AAT_BASELINE_VH_STANDALONE';

    const app  = document.getElementById('app');
    const msg  = document.getElementById('msg');
    const hud  = document.getElementById('hud');

    const p = new URLSearchParams(location.search);
    const appParam = p.get('app') || './index.html';
    const debugOn = p.get('debug') === '1';
    hud.style.display = debugOn ? 'block' : 'none';

    const appURL = new URL(appParam, location.href).href;
    app.src = appURL;

    function viewport(){
      const vv = window.visualViewport;
      const vw = vv ? vv.width  : (window.innerWidth  || document.documentElement.clientWidth  || 0);
      const vh = vv ? vv.height : (window.innerHeight || document.documentElement.clientHeight || 0);
      const vvs = vv ? vv.scale : 1;
      return {vw, vh, vvs};
    }

    function getBaseline(){
      const bw = parseFloat(localStorage.getItem(KEY_W) || '');
      const bh = parseFloat(localStorage.getItem(KEY_H) || '');
      if (!isFinite(bw) || !isFinite(bh) || bw<=0 || bh<=0) return null;
      return {bw, bh};
    }

    function fit(){
      const base = getBaseline();
      if(!base) {
        msg.style.display = 'block';
        return;
      }
      msg.style.display = 'none';

      const {vw, vh, vvs} = viewport();
      const {bw, bh} = base;

      const ar = bw / bh;

      let w, h;
      if ((vw / vh) >= ar){
        h = vh;
        w = h * ar;
      } else {
        w = vw;
        h = w / ar;
      }

      w = Math.floor(w);
      h = Math.floor(h);

      app.style.width = w + 'px';
      app.style.height = h + 'px';

      if (debugOn){
        const dpr = window.devicePixelRatio || 1;
        hud.innerHTML =
          `<div class="row"><b>v6 (standalone baseline)</b></div>` +
          `<div class="row"><span class="k">app</span><span class="v">${esc(appParam)}</span></div>` +
          `<div class="row"><span class="k">baseline</span><span class="v">${rnd(bw)}×${rnd(bh)} (AR ${ar.toFixed(4)})</span></div>` +
          `<div class="row"><span class="k">viewport</span><span class="v">${rnd(vw)}×${rnd(vh)} (AR ${(vw/vh).toFixed(4)})</span></div>` +
          `<div class="row"><span class="k">iframe</span><span class="v">${w}×${h}</span></div>` +
          `<div class="row"><span class="k">dpr</span><span class="v">${dpr.toFixed(2)}</span><span class="k">vv.scale</span><span class="v">${(vvs||1).toFixed(3)}</span></div>`;
      }
    }

    function rnd(x){ return Math.round(x); }
    function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    window.addEventListener('resize', fit, {passive:true});
    window.addEventListener('orientationchange', fit);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fit, {passive:true});

    app.addEventListener('load', fit);
    fit();
  })();
  </script>
</body>
</html>
