<!-- launcher.html -->
<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Launcher</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    /* Fullscreen iframe (σαν standalone) */
    #appFrame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;   /* modern browsers */
      border: 0;
      display: block;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>

<body>
  <iframe id="appFrame" src="./index.html" allow="fullscreen"></iframe>

  <script>
    // Robust sizing for embedded contexts (iframe in page, mobile toolbars, etc.)
    (function () {
      const f = document.getElementById("appFrame");

      function fit() {
        const vv = window.visualViewport;
        const w = vv ? vv.width  : document.documentElement.clientWidth;
        const h = vv ? vv.height : document.documentElement.clientHeight;

        // set explicit px to defeat weird layout constraints
        f.style.width = Math.round(w) + "px";
        f.style.height = Math.round(h) + "px";
      }

      fit();
      window.addEventListener("resize", fit, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", fit, { passive: true });
        window.visualViewport.addEventListener("scroll", fit, { passive: true });
      }
    })();
  </script>
</body>
</html>
