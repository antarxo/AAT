<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Θεατρική Σκηνή — Α.Α.Τ. (Πράξη I, II & Φουαγιέ)</title>

  <link rel="stylesheet" href="https://unpkg.com/uplot@1.6.30/dist/uPlot.min.css">
  <script src="https://unpkg.com/uplot@1.6.30/dist/uPlot.iife.min.js"></script>

  <style>
    :root {
      --foyer-h: 445px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at center, #222 0%, #000 100%);
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f5f5;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Σκηνικό και κοινό */

    #sceneBg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 100;
    }

    #audienceExtra {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      max-width: 100%;
      height: auto;
      z-index: 1350; /* πίσω από τους θεατές */
      pointer-events: none;
    }

    #audienceBase {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      max-width: 100%;
      height: auto;
      z-index: 1500; /* πάνω από extra, κάτω από bubbles */
      pointer-events: none;
    }

    /* Θεατές (avatars) */

    #viewerLayer {
      position: absolute;
      inset: 0;
      z-index: 1400; /* κάτω από κουμπιά, πάνω από extra, κάτω από κοινό */
      pointer-events: none;
    }

    .viewer-avatar {
      position: absolute;
      transform-origin: bottom center;
      image-rendering: auto;
      pointer-events: none;
    }

    /* Bubble για πράξεις 1–2 */

    #bubbleLayer {
      position: absolute;
      inset: 0;
      z-index: 1600; /* πάνω από audienceBase */
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      max-width: 420px;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
      font-size: 15px;
      line-height: 1.4;
      display: none;
    }

    .bubble::after {
      content: "";
      position: absolute;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 10px 10px 0 10px;
      border-color: rgba(0, 0, 0, 0.8) transparent transparent transparent;
      bottom: -10px;
      left: 40px;
    }

    /* Πίνακας νόμων στις πράξεις */

    #lawPanel {
      position: absolute;
      top: 8%;
      left: 4%;
      width: 26%;
      min-height: 30%;
      padding: 10px 12px;
      background: rgba(10, 10, 10, 0.85);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 14px;
      z-index: 1550;
      overflow-y: auto;
    }

    /* Ghost ηθοποιός */

    #ghostActor {
      position: absolute;
      right: 6%;
      top: 30%;
      width: 180px;
      height: auto;
      opacity: 0.0;
      transition: opacity 0.4s ease;
      z-index: 1300;
      pointer-events: none;
    }

    #ghostActor.visible {
      opacity: 0.8;
    }

    /* Foyer */

    #foyerBoard {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 90%;
      height: var(--foyer-h);
      background: rgba(8, 8, 8, 0.92);
      border-top: 2px solid rgba(255, 255, 255, 0.3);
      display: none;
      z-index: 1700;
      padding: 16px 22px;
      display: none;
    }

    #foyerInner {
      display: flex;
      gap: 18px;
      height: 100%;
    }

    .foyer-col {
      flex: 1;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
      overflow-y: auto;
    }

    .foyer-col strong {
      color: #ffe45e;
    }

    /* Κουμπιά πράξεων */

    .controls {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 2000;
    }

    .controls button {
      border: none;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.7);
      color: #f5f5f5;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(6px);
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .controls button:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    .controls button.active {
      background: #ffb703;
      color: #000;
      border-color: #ffb703;
    }

    /* Απλό placeholder για plot (αν το χρειαστούμε) */

    #plotContainer {
      position: absolute;
      right: 4%;
      top: 8%;
      width: 32%;
      height: 26%;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      z-index: 1500;
      overflow: hidden;
    }

    #plotContainer.hidden {
      display: none;
    }

    #plot {
      width: 100%;
      height: 100%;
    }

    /* Κουρτίνες (κρατάω βασικά) */

    .curtain-side {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 16%;
      background: radial-gradient(circle at top, #700 0%, #300 40%, #100 100%);
      z-index: 1900;
      transition: transform 0.9s cubic-bezier(.2,.9,.2,1);
    }

    #curtainLeft {
      left: 0;
      transform-origin: left center;
    }

    #curtainRight {
      right: 0;
      transform-origin: right center;
    }

    .curtain-open #curtainLeft {
      transform: translateX(-100%);
    }

    .curtain-open #curtainRight {
      transform: translateX(100%);
    }

  </style>
</head>
<body>
  <div class="stage" id="stageRoot">

    <!-- Κεντρικό σκηνικό (βάλε εδώ τη δική σου εικόνα σκηνής) -->
    <img id="sceneBg" src="scene_bg.png" alt="Σκηνικό" />

    <!-- Extra κοινό (πίσω από avatars) -->
    <img id="audienceExtra" src="koino_extra.png" alt="Επιπλέον κοινό" />

    <!-- Βασικό κοινό -->
    <img id="audienceBase" src="koino.png" alt="Κοινό" />

    <!-- Layer θεατών (avatars) -->
    <div id="viewerLayer"></div>

    <!-- Ghost ηθοποιός -->
    <img id="ghostActor" src="ghost_actor.png" alt="Ghost mD" />

    <!-- Bubble layer για Πράξεις 1 & 2 -->
    <div id="bubbleLayer">
      <div id="bubbleBox" class="bubble">
        <div id="bubbleText"></div>
      </div>
    </div>

    <!-- Panel νόμων / τύπων -->
    <div id="lawPanel"></div>

    <!-- Plot container (uPlot) -->
    <div id="plotContainer" class="hidden">
      <div id="plot"></div>
    </div>

    <!-- Φουαγιέ (μαυροπίνακας) -->
    <div id="foyerBoard">
      <div id="foyerInner">
        <div id="foyerLeft" class="foyer-col"></div>
        <div id="foyerRight" class="foyer-col"></div>
      </div>
    </div>

    <!-- Κουρτίνες -->
    <div id="curtainLeft" class="curtain-side"></div>
    <div id="curtainRight" class="curtain-side"></div>

    <!-- Κουμπιά πράξεων -->
    <div class="controls">
      <button id="btnAct1">Πράξη I</button>
      <button id="btnAct2">Πράξη II</button>
      <button id="btnFoyer">Φουαγιέ</button>
    </div>
  </div>

  <script>
    // ---------------------------
    // Κατάσταση / globals
    // ---------------------------
    let dialogs = null;
    let viewersMeta = [];
    let currentTimeouts = [];
    let currentIntervals = [];
    let currentAct = null;
    let uplot = null;

    const stageRoot = document.getElementById('stageRoot');
    const audienceBase = document.getElementById('audienceBase');
    const audienceExtra = document.getElementById('audienceExtra');
    const viewerLayer = document.getElementById('viewerLayer');
    const bubbleBox = document.getElementById('bubbleBox');
    const bubbleText = document.getElementById('bubbleText');
    const lawPanel = document.getElementById('lawPanel');
    const foyerBoard = document.getElementById('foyerBoard');
    const foyerLeft = document.getElementById('foyerLeft');
    const foyerRight = document.getElementById('foyerRight');
    const ghostActor = document.getElementById('ghostActor');
    const plotContainer = document.getElementById('plotContainer');
    const plotDiv = document.getElementById('plot');

    const btnAct1 = document.getElementById('btnAct1');
    const btnAct2 = document.getElementById('btnAct2');
    const btnFoyer = document.getElementById('btnFoyer');

    // ---------------------------
    // Helpers: cancel / timeouts
    // ---------------------------
    function clearAllTimers() {
      currentTimeouts.forEach(t => clearTimeout(t));
      currentIntervals.forEach(i => clearInterval(i));
      currentTimeouts = [];
      currentIntervals = [];
    }

    function setSafeTimeout(fn, ms) {
      const id = setTimeout(fn, ms);
      currentTimeouts.push(id);
    }

    function setSafeInterval(fn, ms) {
      const id = setInterval(fn, ms);
      currentIntervals.push(id);
    }

    // ---------------------------
    // Helpers: viewers meta
    // ---------------------------
    function getViewerMeta(viewerId) {
      return viewersMeta.find(v => v.id === viewerId) || null;
    }

    // ---------------------------
    // Layout / positioning
    // ---------------------------
    function computeAudienceMetrics() {
      const stageRect = stageRoot.getBoundingClientRect();
      const aRect = audienceBase.getBoundingClientRect();
      // xFrac * πλάτος, y από ΚΑΤΩ
      return {
        stageRect,
        aRect,
        baselineY: aRect.bottom - stageRect.top,
        leftX: aRect.left - stageRect.left,
        width: aRect.width
      };
    }

    function positionAvatars() {
      if (!audienceBase.complete) return;
      const m = computeAudienceMetrics();
      viewersMeta.forEach(v => {
        const avatar = viewerLayer.querySelector(`.viewer-avatar[data-viewer-id="${v.id}"]`);
        if (!avatar) return;
        const scale = v.avatarScale || 1.0;

        const x = m.leftX + m.width * v.xFrac;
        const baseY = m.baselineY - (v.avatarDy || 0);

        avatar.style.transform = `translate(-50%, 0) scale(${scale})`;
        avatar.style.left = `${x}px`;
        // Το ύψος δεν το ξέρουμε μέχρι να φορτώσει, οπότε ευθυγράμμιση "πόδια" στο baseY
        const h = avatar.naturalHeight ? avatar.naturalHeight * scale : 120 * scale;
        avatar.style.top = `${baseY - h}px`;
      });
    }

    function positionBubbleForViewer(viewerId, xShift, yOffset) {
      const meta = getViewerMeta(viewerId);
      if (!meta || !audienceBase.complete) return;

      const m = computeAudienceMetrics();
      const baseX = m.leftX + m.width * meta.xFrac;
      const baseY = m.baselineY;

      const dx = (meta.bubbleDx || 0) + (xShift || 0);
      const dy = (meta.bubbleDy || 0) + (yOffset || 0);

      // Από ΚΑΤΩ πάμε ΠΑΝΩ, άρα baseY - dy
      const x = baseX + dx;
      const y = baseY - dy;

      bubbleBox.style.left = `${x}px`;
      bubbleBox.style.top = `${y}px`;
      bubbleBox.style.display = 'block';
    }

    function hideBubble() {
      bubbleBox.style.display = 'none';
    }

    // ---------------------------
    // Viewer avatars εμφάνιση
    // ---------------------------
    function setupViewerAvatars() {
      viewerLayer.innerHTML = '';
      (viewersMeta || []).forEach(v => {
        const img = document.createElement('img');
        img.className = 'viewer-avatar';
        img.dataset.viewerId = String(v.id);
        img.src = v.img;
        img.alt = v.name_gr || `Θεατής ${v.id}`;
        viewerLayer.appendChild(img);
      });
      // μετά το onload του κοινού θα γίνει positionAvatars
      positionAvatars();
    }

    function hideAllAvatars() {
      viewerLayer.querySelectorAll('.viewer-avatar').forEach(el => {
        el.style.opacity = '0';
      });
    }

    function showAvatar(viewerId) {
      hideAllAvatars();
      const avatar = viewerLayer.querySelector(`.viewer-avatar[data-viewer-id="${viewerId}"]`);
      if (avatar) {
        avatar.style.opacity = '1';
      }
    }

    // ---------------------------
    // Curtain / mode
    // ---------------------------
    function setCurtains(open) {
      if (open) {
        stageRoot.classList.add('curtain-open');
      } else {
        stageRoot.classList.remove('curtain-open');
      }
    }

    function setMode(mode) {
      currentAct = mode;
      btnAct1.classList.toggle('active', mode === 'act1');
      btnAct2.classList.toggle('active', mode === 'act2');
      btnFoyer.classList.toggle('active', mode === 'foyer');

      if (mode === 'foyer') {
        foyerBoard.style.display = 'block';
        lawPanel.style.display = 'none';
        plotContainer.classList.add('hidden');
        hideBubble();
      } else {
        foyerBoard.style.display = 'none';
        lawPanel.style.display = 'block';
        // plot εμφανίζεται αν ζητηθεί
      }
    }

    // ---------------------------
    // Typewriter
    // ---------------------------
    function typewriter(element, htmlText, typeMs, cb) {
      element.innerHTML = '';
      if (!htmlText || typeMs === 0) {
        element.innerHTML = htmlText || '';
        if (cb) cb();
        return;
      }

      // για να μην κάνουμε parser HTML χαρακτήρα-χαρακτήρα, θα γράφουμε “ωμά”
      const text = htmlText;
      let i = 0;
      const delay = Math.max(10, typeMs / Math.max(1, text.length));

      const id = setInterval(() => {
        i++;
        element.innerHTML = text.slice(0, i);
        if (i >= text.length) {
          clearInterval(id);
          currentIntervals = currentIntervals.filter(x => x !== id);
          if (cb) cb();
        }
      }, delay);
      currentIntervals.push(id);
    }

    // ---------------------------
    // Plot (απλό demo με uPlot)
    // ---------------------------
    function showDemoPlot(kind) {
      // kind: "x", "v", "a", "ax" κλπ
      plotContainer.classList.remove('hidden');

      const N = 200;
      const xs = [];
      const ys = [];
      const A = 1;
      const w = 2 * Math.PI;

      for (let i = 0; i < N; i++) {
        const t = (i / (N - 1)) * 2 * Math.PI;
        xs.push(t);
        let y;
        if (kind === 'v') y = w * A * Math.cos(w * t);
        else if (kind === 'a') y = -w * w * A * Math.sin(w * t);
        else if (kind === 'ax') y = -w * w * A * Math.sin(w * t); // placeholder
        else y = A * Math.sin(w * t);
        ys.push(y);
      }

      if (uplot) {
        uplot.setData([xs, ys]);
        return;
      }

      uplot = new uPlot({
        width: plotDiv.clientWidth || 300,
        height: plotDiv.clientHeight || 180,
        series: [
          {},
          { label: kind || 'x', points: { show: false } }
        ]
      }, [xs, ys], plotDiv);
    }

    function hidePlot() {
      plotContainer.classList.add('hidden');
    }

    // ---------------------------
    // Ghost actor
    // ---------------------------
    function setGhostVisible(flag) {
      if (flag) {
        ghostActor.classList.add('visible');
      } else {
        ghostActor.classList.remove('visible');
      }
    }

    // ---------------------------
    // Generic sequence player
    // ---------------------------
    function playSequence(lines, config) {
      clearAllTimers();
      hideBubble();
      hideAllAvatars();
      lawPanel.innerHTML = '';
      foyerLeft.innerHTML = '';
      foyerRight.innerHTML = '';
      setGhostVisible(false);
      hidePlot();

      if (!Array.isArray(lines) || lines.length === 0) return;

      let index = 0;

      function step() {
        if (index >= lines.length) {
          hideBubble();
          hideAllAvatars();
          return;
        }

        const line = lines[index++];
        if (!line) {
          setSafeTimeout(step, 0);
          return;
        }

        // special actions with "kind" για πράξεις
        const kind = line.kind || null;

        // Ghost control (act2)
        if (line.gStart) setGhostVisible(true);
        if (line.gStop) setGhostVisible(false);

        if (kind === 'graph') {
          // Εμφάνιση βασικού x(t)
          showDemoPlot('x');
          setSafeTimeout(step, line.pauseMs || 0);
          return;
        }

        if (kind === 'lawPlot') {
          const plotKind = line.plot || 'v';
          showDemoPlot(plotKind);
          setSafeTimeout(step, line.pauseMs || 0);
          return;
        }

        if (kind === 'close') {
          hideBubble();
          hideAllAvatars();
          hidePlot();
          setGhostVisible(false);
          return;
        }

        // FOYER
        if (config.mode === 'foyer') {
          const viewerId = line.viewer || null;
          if (viewerId) showAvatar(viewerId);
          const tMs = line.typeMs || 0;
          const pMs = line.pauseMs || 0;

          typewriter(foyerLeft, line.left || '', tMs, () => {
            typewriter(foyerRight, line.right || '', tMs, () => {
              setSafeTimeout(step, pMs);
            });
          });
          return;
        }

        // ΠΡΑΞΕΙΣ 1–2
        const viewerId = line.viewer || null;
        const tMs = line.typeMs || 0;
        const pMs = line.pauseMs || 0;

        // Αν έχει viewer -> bubble πάνω από θεατή
        if (viewerId) {
          showAvatar(viewerId);
          positionBubbleForViewer(viewerId, line.xShift || 0, line.yOffset || 0);
          typewriter(bubbleText, line.left || '', tMs, () => {
            // Αν right υπάρχει, πάει στον πίνακα νόμων
            if (line.right) {
              lawPanel.innerHTML = line.right;
            }
            setSafeTimeout(step, pMs);
          });
        } else {
          // viewer == null -> “καθαρός” νόμος / κείμενο στον lawPanel
          const txt = (line.left || '') + (line.right || '');
          typewriter(lawPanel, txt, tMs, () => {
            setSafeTimeout(step, pMs);
          });
        }
      }

      step();
    }

    // ---------------------------
    // Act functions
    // ---------------------------

    function playAct1() {
      if (!dialogs) return;
      setMode('act1');
      setCurtains(true);
      playSequence(dialogs.act1 || [], { mode: 'act1' });
    }

    function playAct2() {
      if (!dialogs) return;
      setMode('act2');
      setCurtains(true);
      playSequence(dialogs.act2 || [], { mode: 'act2' });
    }

    function playFoyer() {
      if (!dialogs) return;
      setMode('foyer');
      setCurtains(false);
      playSequence(dialogs.foyer || [], { mode: 'foyer' });
    }

    // ---------------------------
    // Init
    // ---------------------------

    async function loadDialogs(lang = 'gr') {
      const url = `dialogs-${lang}.json`;
      const res = await fetch(url);
      dialogs = await res.json();

      // viewers από dialogs
      viewersMeta = (dialogs.viewers || []).map(v => ({
        id: v.id,
        name_gr: v.name_gr,
        name_en: v.name_en,
        color: v.color,
        xFrac: v.xFrac,
        bubbleDx: v.bubbleDx,
        bubbleDy: v.bubbleDy,
        avatarDy: v.avatarDy,
        avatarScale: v.avatarScale,
        img: v.img
      }));

      setupViewerAvatars();
    }

    window.addEventListener('load', async () => {
      try {
        await loadDialogs('gr');
      } catch (e) {
        console.error('Αποτυχία φόρτωσης dialogs-gr.json', e);
      }
      positionAvatars();
      setMode('act1');
      setCurtains(true);
      // default: ξεκινάμε Πράξη 1
      playAct1();
    });

    window.addEventListener('resize', () => {
      positionAvatars();
    });

    audienceBase.addEventListener('load', () => {
      positionAvatars();
    });

    // Buttons
    btnAct1.addEventListener('click', () => {
      clearAllTimers();
      playAct1();
    });

    btnAct2.addEventListener('click', () => {
      clearAllTimers();
      playAct2();
    });

    btnFoyer.addEventListener('click', () => {
      clearAllTimers();
      playFoyer();
    });

  </script>
</body>
</html>
