<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Θεατρική Σκηνή – Mockup</title>
<style>
  body {
    margin: 0;
    background: radial-gradient(circle at center, #222 0%, #000 100%);
    overflow: hidden;
    font-family: Inter, system-ui, sans-serif;
  }
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
    
  .curtain-side.left {
    left: 0;
    background: linear-gradient(to right, #300000, #1a0000);
    box-shadow: inset -6px 0 10px rgba(0,0,0,0.6);
  }
  .curtain-side.right {
    right: 0;
    background: linear-gradient(to left, #300000, #1a0000);
    box-shadow: inset 6px 0 10px rgba(0,0,0,0.6);
  }
  .curtain-top {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 28%;
    background: linear-gradient(to bottom, #230000, #180000);
    box-shadow: 0 5px 18px rgba(0,0,0,0.8);
    z-index: 30;
  }
  .curtain-upper {
    position: absolute;
    top: 28%;
    left: 0;
    width: 100%;
    height: 40%;
    background: linear-gradient(to bottom, #8b0000, #400000);
    transform-origin: top;
    z-index: 30;
  }
  .curtain-lower {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 32%;
    background: linear-gradient(to top, #7a0000, #300000);
    transform-origin: bottom;
    z-index: 30;
  }
  .curtain-side {
    position: absolute;
    top: 0;
    width: 18%;
    height: 100%;
    z-index: 30;
  }
  .spring {
    position: absolute;
    bottom: calc(32vh + 82px);
    left: 10%;
    height: 96px;
    width: auto;
    z-index: 5;
    pointer-events: none;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.55));
    transform-origin: left center;
    opacity: 0;
    transition: opacity 0.4s linear;
  }

    .actor {
    position: absolute;
    bottom: calc(32vh + 130px);
    left: 50%;
    width: 144px;
    height: 96px;
    transform: translate(-50%, 0);
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s linear;
  }

  

  .floor {
    position: absolute;
    left: 0;
    bottom: calc(32vh - 8px);
    width: 100%;
    height: 2px;
    background: #888;
    z-index: 20;
    pointer-events: none;
  }

  .audience {
    position: absolute;
    left: 18%;
    bottom: 0;
    width: 64%;
    height: auto;
    z-index: 150;
    pointer-events: none;
    display: block;
  }
  .actor img {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
  }

  .viewers {
    position: absolute;
    bottom: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 3vw;
    z-index: 1;
    padding-bottom: 12px;
  }
  .viewer {
    width: 60px;
    height: 100px;
    background: url('https://upload.wikimedia.org/wikipedia/commons/f/f9/Silhouette_icon.svg') no-repeat center/contain;
    filter: grayscale(1) brightness(0.6);
    opacity: 0.75;
  }

  .signboard {
    position: absolute;
    top: -6px; /* ανέβηκε 20px πιο ψηλά */
    left: 50%;
    transform: translateX(-50%);
    background: transparent; /* πλήρως διαφανές φόντο */
    border: none;
    border-radius: 10px;
    padding: 14px 22px;
    color: #ddd;
    font-family: 'Georgia', serif;
    text-align: center;
    z-index: 40;
    line-height: 1.6;
  }
  .signboard h1 {
    font-size: 32px;
    margin: 0;
    color: #fff;
  }
  .signboard h2 {
    font-size: 20px;
    margin: 4px 0 0 0;
  }
  .signboard h3 {
    font-size: 18px;
    margin: 4px 0 0 0;
    color: #ffd27a;
  }

  .open .curtain-upper { transform: translateY(-100%); }
  .open .curtain-lower { transform: translateY(100%); }

  .start-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 100;
    background: #700;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 0 10px #300;
  }  .open .actor, .open .spring { opacity:1; }
  @media (max-width: 600px) {
    .actor {
      bottom: calc(32vh + 80px);
      left: 50%;
      width: 100px;
      height: 66px;
      transform: translate(-50%, 0);
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s linear;
    }

    .spring {
      bottom: calc(32vh + 47px);
      left: 10%;
      height: 66px;
      width: auto;
      z-index: 5;
      pointer-events: none;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.55));
      transform-origin: left center;
      opacity: 0;
      transition: opacity 0.4s linear;
    }

    .signboard {
      padding: 8px 12px;
    }
    .signboard h1 {
      font-size: 20px;
    }
    .signboard h2 {
      font-size: 14px;
    }
    .signboard h3 {
      font-size: 12px;
    }
  }
  @media (max-width: 600px) {
    /* Ρύθμιση για κινητό: κατέβασμα skater ώστε να μην βγαίνει από τη σκηνή */
    .actor {
      bottom: calc(32vh + 40px);
      width: 100px;
      height: 66px;
    }
    /* Ελατήριο χαμηλότερα και στη μέση του skater */
    .spring {
      bottom: calc(32vh + 7px);
      height: 66px;
    }
    /* Κοινό ορατό και μικρότερο ύψος για να χωράει */
    .audience {
      left: 18%;
      bottom: 0;
      width: 64%;
      height: 40px;
      z-index: 150;
      pointer-events: none;
      display: block;
    }
    .signboard {
      padding: 8px 12px;
    }
    .signboard h1 {
      font-size: 20px;
    }
    .signboard h2 {
      font-size: 14px;
    }
    .signboard h3 {
      font-size: 12px;
    }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="curtain-top"></div>
    <div class="curtain-upper"></div>
    <div class="curtain-lower"></div>
    <div class="curtain-side left"></div>
    <div class="curtain-side right"></div>

    <div class="signboard">
      <h1>Πράξη 1</h1>
      <h2>m₁ = 70 kg, D₁ = 77 N/m</h2>
      <h3>Εμηχ = 347 J</h3>
    </div>

    <!-- Ελατήριο (μόνο εικόνα) -->
    <img id="spring" class="spring" src="spring.png" alt="ελατήριο">

    <div class="actor" id="actor">
      <img src="skater.png" alt="Skater">
    </div>

    <div class="floor"></div>

    <img class="audience" src="koino.png" alt="κοινό">

    <div class="viewers">
      <div class="viewer" data-idx="0"></div>
      <div class="viewer" data-idx="1"></div>
      <div class="viewer" data-idx="2"></div>
      <div class="viewer" data-idx="3"></div>
      <div class="viewer" data-idx="4"></div>
    </div>

    <button class="start-btn" id="startBtn">Έναρξη</button>
  </div>

  <script>
    const m = 70;
    const T = 6.0;
    const A_m = 3.0;
    const omega = 2*Math.PI / T;
    const D = Math.round(m * omega * omega);
    const E_mech = 0.5 * D * A_m * A_m;

    const pxPerMeter = 50;
    let A_px = pxPerMeter * A_m;

    document.addEventListener('DOMContentLoaded', ()=>{
      const h2 = document.querySelector('.signboard h2');
      const h3 = document.querySelector('.signboard h3');
      h2.textContent = `m₁ = ${m} kg, D₁ = ${D} N/m`;
      h3.textContent = `Εμηχ = ${Math.round(E_mech)} J`;
    });

    let t0 = performance.now();
    const actor = document.getElementById('actor');
    const stage = document.getElementById('stage');
    const startBtn = document.getElementById('startBtn');
    const springEl = document.getElementById('spring');

    let lastFrame = performance.now();

    // Γεωμετρία ελατηρίου / skater
    let L0_px;          // πραγματικό μήκος ηρεμίας του spring.png (px) όπως αποδίδεται στη σκηνή
    let skaterWidthPx;  // πραγματικό πλάτος του skater στη σκηνή (px)
    let hookOffsetPx;   // pixel πρόσδεσης μέσα στον skater (προς το παρόν το κέντρο)

    function anchorX(){
      // Δεξί άκρο αριστερής κουρτίνας: πλάτος 18% ⇒ άκρη στο 18%
      return stage.clientWidth * 0.18;
    }

    function animate(now){
      const dt = (now - lastFrame)/1000; lastFrame = now;
      const t = (now - t0)/1000;

      // μετρήσεις σε κάθε frame ώστε να δουλεύει και σε mobile breakpoints
      const springRect = springEl.getBoundingClientRect();
      const skRect = actor.getBoundingClientRect();

      if (springRect.width > 0 && skRect.width > 0) {
        L0_px = springRect.width;        // τρέχον μήκος ηρεμίας ελατηρίου (scaled)
        skaterWidthPx = skRect.width;    // τρέχον πλάτος skater (scaled)
        hookOffsetPx = skaterWidthPx / 2; // προσωρινά δέσιμο στο κέντρο

        // άκρο κουρτίνας (σταθερό άκρο ελατηρίου)
        const ax = anchorX();
        // κέντρο σκηνής = σημείο ισορροπίας της ταλάντωσης
        const centerX = stage.clientWidth / 2;
        // θέση γάντζου skater γύρω από το κέντρο
        const skaterHookX = centerX + A_px * Math.sin(omega * t);

        // προσαρμογή ελατηρίου για να φτάσει τον γάντζο
        const distance = skaterHookX - ax;
        const scale = distance / L0_px;
        springEl.style.left = ax + 'px';
        springEl.style.transform = `scaleX(${scale})`;

        // τοποθέτηση skater ώστε ο γάντζος του να κάτσει εκεί
        actor.style.transform = 'none';
        actor.style.left = (skaterHookX - hookOffsetPx) + 'px';
      }

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    startBtn.addEventListener('click', ()=>{
      stage.classList.add('open');
      startBtn.style.display = 'none';
    });
  </script>
</body>
</html>
