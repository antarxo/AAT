<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AAT Launcher — 1600×900 scaling</title>
  <style>
    html,body{height:100%;margin:0;overflow:hidden;background:#0b0f14;}
    #wrap{
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
    }
    #pane{
      width:1600px; height:900px;
      transform-origin:center center;
      position:relative;
      background:transparent;
    }
    #app{
      width:1600px; height:900px;
      border:0;
      display:block;
      background:transparent;
    }
    #msg{
      position:fixed; left:50%; top:50%;
      transform:translate(-50%,-50%);
      max-width:min(720px, 92vw);
      background:rgba(20,24,32,.92);
      color:#e7eefc;
      font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      padding:16px 18px;
      border:1px solid rgba(255,255,255,.16);
      border-radius:12px;
      box-shadow:0 14px 40px rgba(0,0,0,.55);
      display:none;
    }
    #msg b{display:block;margin-bottom:8px;font-size:15px;}
    #msg code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px;}
    #msg .small{opacity:.85;margin-top:10px;font-size:13px;}
  </style>
</head>
<body>
  <div id="wrap">
    <div id="pane">
      <iframe id="app" src="./index.html" scrolling="no"></iframe>
    </div>
  </div>

  <div id="msg">
    <b>Δεν φορτώνει το app.</b>
    Αυτό το αρχείο πρέπει να είναι <u>στον ίδιο φάκελο</u> με το <code>index.html</code> και τα assets του (css/js/png/json).
    <div class="small">
      Αν το ανοίγεις με <code>file://</code> και ο browser κάνει νερά, άνοιξε τον φάκελο με ένα απλό local server
      (π.χ. <code>python -m http.server</code>) και μπες από <code>http://localhost:8000</code>.
    </div>
  </div>

  <script>
  (function(){
    const BASE_W = 1600, BASE_H = 900;
    const pane = document.getElementById('pane');
    const app  = document.getElementById('app');
    const msg  = document.getElementById('msg');

    function fit(){
      const vw = window.innerWidth || document.documentElement.clientWidth || BASE_W;
      const vh = window.innerHeight || document.documentElement.clientHeight || BASE_H;
      const s = Math.min(vw/BASE_W, vh/BASE_H);
      pane.style.transform = `scale(${s})`;
    }
    window.addEventListener('resize', fit, {passive:true});
    window.addEventListener('orientationchange', fit);
    fit();

    // Προσπάθεια να ανιχνεύσουμε "blank/failed" load (best-effort)
    let shown = false;
    function showMsg(){ msg.style.display = 'block'; }
    function hideMsg(){ msg.style.display = 'none'; }

    app.addEventListener('load', ()=>{
      try{
        const doc = app.contentDocument;
        const ok = doc && doc.body && doc.body.children && doc.body.children.length > 0;
        if(ok) hideMsg();
        else showMsg();
      }catch(e){
        // Αν δεν έχουμε πρόσβαση (κάποια file:// quirks), μην το κρύβεις — δείξε οδηγίες.
        showMsg();
      }
    });

    // Αν μετά από 1.2s δεν έχει φορτώσει κάτι, δείξε οδηγίες.
    setTimeout(()=>{
      try{
        const doc = app.contentDocument;
        const ok = doc && doc.body && doc.body.children && doc.body.children.length > 0;
        if(!ok) showMsg();
      }catch(e){
        showMsg();
      }
    }, 1200);
  })();
  </script>
</body>
</html>
