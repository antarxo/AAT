/* ====== ΧΤΙΣΙΜΟ ACT1 TIMELINE ΑΠΟ dialogs.act1 ====== */
const DEFAULT_FIRST_MUL=1.1;

function buildAct1TimelineFromArray(arr){
  const result=[];
  if(!Array.isArray(arr)) return result;

  let seqIdx=0;
  for(const item of arr){
    if(!item) continue;

    // viewer: 1..5 → index 0..4
    let viewerIdx = 0;
    if(typeof item.viewer === 'number' && item.viewer>0){
      viewerIdx = item.viewer-1;
    }

    const yOffset = (typeof item.yOffset==='number')
      ? item.yOffset
      : (typeof item.y === 'number' ? item.y : 135);

    const xShift = (typeof item.xShift==='number')
      ? item.xShift
      : (typeof item.x === 'number' ? item.x : 0);

    const baseMul = (typeof item.atT==='number')
      ? item.atT
      : (typeof item.tMul==='number'
        ? item.tMul
        : (DEFAULT_FIRST_MUL + 0.25*seqIdx));

    const ev = {
      kind: 'bubble',
      viewer: viewerIdx,
      yOffset,
      xShift,
      atT: baseMul
    };

    // map typeMs / pauseMs → sec
    if(typeof item.typeMs === 'number')  ev.dur        = item.typeMs  / 1000;
    if(typeof item.pauseMs=== 'number')  ev.pauseAfter = item.pauseMs / 1000;

    // ειδικές περιπτώσεις από τη ΔΟΜΗ που έδωσες
    if(item.graph === 'xt'){
      ev.kind = 'graph';
    }else if(item.plot){
      ev.kind = 'lawPlot';
      ev.plot = item.plot;   // "v","a","ax"
    }else if(item.param){
      ev.kind = 'bubbleDyn'; // "phi","A","Tw"
      ev.what = item.param;
    }else if(item.close){
      ev.kind = 'close';
    }else if(item.right && item.right.trim() && (item.viewer === null || item.viewer === undefined)){
      ev.kind    = 'law';
      ev.lawText = item.right;
      if(item.alsoParams != null) ev.alsoParams = !!item.alsoParams;
      if(item.showParams != null) ev.alsoParams = !!item.showParams;
    }else{
      ev.kind = 'bubble';
      ev.text = item.left || '';
    }

    result.push(ev);
    seqIdx++;
  }
  return result;
}

/* ====== ΧΤΙΣΙΜΟ ACT2 TIMELINE ΑΠΟ dialogs.act2 ====== */
function buildAct2TimelineFromArray(arr){
  const result=[];
  if(!Array.isArray(arr)) return result;

  for(const item of arr){
    if(!item) continue;

    let viewerIdx = 0;
    if(typeof item.viewer === 'number' && item.viewer>0){
      viewerIdx = item.viewer-1;
    }

    const yOffset = (typeof item.yOffset==='number')
      ? item.yOffset
      : (typeof item.y==='number' ? item.y : 135);

    const xShift = (typeof item.xShift==='number')
      ? item.xShift
      : (typeof item.x==='number' ? item.x : 0);

    const step = {
      viewer: viewerIdx,
      v: viewerIdx,
      yOffset,
      xShift,
      gStart: !!item.gStart,
      gStop:  !!item.gStop
    };

    if(typeof item.typeMs === 'number')  step.dur        = item.typeMs  / 1000;
    if(typeof item.pauseMs=== 'number')  step.pauseAfter = item.pauseMs / 1000;

    // τα 4 τελευταία της act2: viewer:null + right → νόμοι
    if((item.viewer === null || item.viewer === undefined)
       && !item.left
       && item.right && item.right.trim()){
      step.lawText = item.right;
    }else{
      step.text = item.left || '';
    }

    result.push(step);
  }

  return result;
}

/* ====== ΦΟΡΤΩΣΗ ΜΟΝΟ dialogs-*.json ====== */
async function loadDialogOverrides(lang){
  try{
    const resp = await fetch(`dialogs-${lang}.json`, {cache:'no-store'});
    if(!resp.ok) return;
    const data = await resp.json() || {};
    const dlg  = DIALOGS[lang] || (DIALOGS[lang]={ act1:[], act2:[], foyer:[] });

    dlg.act1  = Array.isArray(data.act1)  ? data.act1.slice()  : [];
    dlg.act2  = Array.isArray(data.act2)  ? data.act2.slice()  : [];
    dlg.foyer = Array.isArray(data.foyer) ? data.foyer.map(it=>({
      left:   it.left  || '',
      right:  it.right || '',
      viewer: (typeof it.viewer==='number' ? it.viewer : 1),
      typeMs: (typeof it.typeMs==='number' ? it.typeMs : undefined),
      pauseMs:(typeof it.pauseMs==='number'? it.pauseMs: undefined)
    })) : [];

    // ACT1 / ACT2 timeline φτιάχνονται ΜΟΝΟ από dialogs-gr
    if(lang === 'gr'){
      thoughtScriptBase = buildAct1TimelineFromArray(dlg.act1);
      thoughtScript     = [...thoughtScriptBase];
      ACT2_TIMELINE     = buildAct2TimelineFromArray(dlg.act2);
    }

    // viewers: βάφουμε τους θεατές και κρατάμε χρώματα / ονόματα
    if(Array.isArray(data.viewers) && data.viewers.length){
      FOYER_VIEWERS = data.viewers.map((v,idx)=>({
        id: idx+1,
        ...v
      }));
      applyViewersToDom();
    }

    if(data.ui && typeof data.ui === 'object'){
      UI[lang] = data.ui;
    }

  }catch(e){
    console.error('loadDialogOverrides error', e);
  }
}

/* ====== TYPEWRITER HTML (ΠΡΑΞΕΙΣ) ====== */
function typeWriterHTML(el, html, speed, done){
  el.innerHTML = html || '';
  const textNodes=[];
  function collect(node){
    if(node.nodeType===3){
      textNodes.push({node, text:node.textContent});
      node.textContent='';
    }else if(node.nodeType===1){
      for(const child of node.childNodes) collect(child);
    }
  }
  collect(el);
  const totalChars = textNodes.reduce((s,o)=>s+o.text.length,0);
  let i=0;
  (function tick(){
    let remaining = i;
    for(const obj of textNodes){
      if(remaining>obj.text.length){
        obj.node.textContent=obj.text;
        remaining-=obj.text.length;
      }else{
        obj.node.textContent=obj.text.slice(0, remaining);
        remaining=0;
      }
    }
    i++;
    if(i<=totalChars){
      setTimeout(tick, speed);
    }else{
      if(typeof done==='function') done();
    }
  })();
}

/* ====== ΧΡΩΜΑΤΑ ====== */
function tint(hex, alpha){
  const c = (hex||'#ffffff').replace('#','');
  const r=parseInt(c.slice(0,2),16)||255, g=parseInt(c.slice(2,4),16)||255, b=parseInt(c.slice(4,6),16)||255;
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ====== BUBBLE SCHEDULER (Πράξεις) ====== */
class BubbleScheduler {
  constructor(panelEl, labelEl){
    this.el=panelEl;
    this.labelEl=labelEl;
    this._queue=Promise.resolve();
    this._currentCancel=null;
    this._ALLOWED=new Set(['b','strong','i','em','sub','sup','br','span']);
  }
  sanitize(html){
    const wrap=document.createElement('div'); wrap.innerHTML=html||'';
    wrap.querySelectorAll('*').forEach(n=>{
      const tag=n.tagName.toLowerCase();
      if(!this._ALLOWED.has(tag)) n.replaceWith(document.createTextNode(n.textContent));
      else [...n.attributes].forEach(a=>n.removeAttribute(a.name));
    });
    return wrap.innerHTML;
  }
  computeDur(text){
    const s=String(text||''); const len=s.length; const BASE=0.8, PER=0.055, MIN=2.0, MAX=10.0;
    return Math.max(MIN, Math.min(MAX, BASE+PER*len)) * (bubbleDurationSec/3.0);
  }
  showSpeaker(viewer){
    if(!this.labelEl) return;
    const viewersArr = Array.isArray(FOYER_VIEWERS) ? FOYER_VIEWERS : [];
    const fv = viewersArr[viewer] || viewersArr[0] || null;

    const vEl=document.querySelector(`.viewer[data-idx="${viewer}"]`);
    if(!vEl){ this.labelEl.style.display='none'; return; }
    const sRect=stage.getBoundingClientRect();
    const vRect=vEl.getBoundingClientRect();
    const centerX=(vRect.left+vRect.width/2)-sRect.left;
    const topPx=Math.max(10,(vRect.top-sRect.top)-110);

    let labelText='';
    if(fv){
      if(LANG==='en'){
        labelText = fv.name_en || fv.name || (`SPECTATOR ${viewer+1}`);
      }else{
        labelText = fv.name_gr || fv.name || (`ΘΕΑΤΗΣ ${viewer+1}`);
      }
      this.labelEl.style.backgroundColor=tint(fv.color,0.9);
    }else{
      labelText = (LANG==='en' ? `SPECTATOR ${viewer+1}` : `ΘΕΑΤΗΣ ${viewer+1}`);
      this.labelEl.style.backgroundColor='rgba(0,0,0,0.7)';
    }

    this.labelEl.textContent = labelText;
    this.labelEl.style.left=centerX+'px';
    this.labelEl.style.top=topPx+'px';
    this.labelEl.style.transform='translateX(-50%)';
    this.labelEl.style.display='block';
  }

  placePanelNearViewer(viewer,lift=140,xShift=0){
    const W = stage.clientWidth;
    const H = stage.clientHeight;

    const xL = W * 0.18;
    const xR = W * 0.82;
    const pad = 12;

    this.el.style.display='block';
    this.el.style.opacity='0';
    this.el.style.left='0px';
    this.el.style.top='0px';

    const bw = this.el.offsetWidth || 320;

    const vEl = document.querySelector(`.viewer[data-idx="${viewer}"]`);
    const sRect = stage.getBoundingClientRect();

    let baseCenterX;
    if(vEl){
      const vRect = vEl.getBoundingClientRect();
      baseCenterX = (vRect.left + vRect.width/2) - sRect.left;
    }else{
      const totalViewers = Math.max(1, (document.querySelectorAll('.viewer').length || 5));
      const idx = Math.max(0, Math.min(totalViewers-1, viewer|0));
      const rel = (idx + 1) / (totalViewers + 1);
      baseCenterX = xL + rel * (xR - xL);
    }

    let centerX = baseCenterX + (xShift || 0);
    centerX = Math.max(xL + pad + bw/2, Math.min(centerX, xR - pad - bw/2));

    const leftPx = centerX - bw/2;

    const baseTop = H * 0.23;
    const liftVal = (typeof lift === 'number' ? lift : 135);
    const deltaY = (135 - liftVal);
    const topPx = Math.max(40, baseTop + deltaY);

    this.el.style.left = leftPx + 'px';
    this.el.style.top  = topPx + 'px';
  }

  showOnce({viewer,text,lift,xShift,durSec,pauseAfterSec}){
    return new Promise(resolve=>{
      if(this._currentCancel){ try{ this._currentCancel(); }catch{} this._currentCancel=null; }
      const textEl=this.el.querySelector('.text');
      const sanitized = this.sanitize(text||'');
      const plain = sanitized.replace(/<[^>]+>/g,'');
      const totalChars = Math.max(plain.length,10);

      const effectiveDurSec = (typeof durSec==='number' && durSec>0)
        ? durSec
        : (bubbleDurationSec || 3.0);
      const baseMs = effectiveDurSec*1000;
      const speed = Math.max(15, Math.min(80, Math.round(baseMs/totalChars)));

      let done=false;
      let started=false;

      this.showSpeaker(viewer);

      const timerId = setTimeout(()=>{
        if(done) return;
        started=true;

        this.placePanelNearViewer(viewer,lift,xShift);

        this.el.classList.add('active');
        this.el.style.opacity='1';
        isBubbleActive=true;
        setMode('slow');

        typeWriterHTML(textEl, sanitized, speed, ()=>{
          const extraPause = (typeof pauseAfterSec==='number' && pauseAfterSec>=0)
            ? pauseAfterSec*1000
            : 500;
          setTimeout(()=>cancel(), extraPause);
        });
      }, 220);

      const cancel=()=>{
        if(done) return;
        done=true;
        clearTimeout(timerId);
        if(!started){
          if(this.labelEl) this.labelEl.style.display='none';
          isBubbleActive=false;
          setMode('run');
          resolve();
          return;
        }
        this.el.classList.add('closing');
        setTimeout(()=>{
          this.el.classList.remove('active','closing');
          this.el.style.display='none'; this.el.style.opacity='0';
          isBubbleActive=false;
          if(this.labelEl) this.labelEl.style.display='none';
          setMode('run');
          resolve();
        },220);
      };
      this._currentCancel=cancel;
    });
  }
  say(viewer,text,lift=140,xShift=0,durSec=null,pauseAfterSec=null){
    this._queue=this._queue.then(()=>this.showOnce({viewer,text,lift,xShift,durSec,pauseAfterSec}));
    return this._queue;
  }
  clear(){
    if(this._currentCancel){ try{ this._currentCancel(); }catch{} this._currentCancel=null; }
    this._queue=Promise.resolve();
    this.el.style.display='none';
    if(this.labelEl) this.labelEl.style.display='none';
  }
}

/* ====== HANDLER TIMELINE ΠΡΑΞΗΣ 1 ====== */
function handleTimelineEvent(th){
  if(th.kind==='bubble'){
    const txt = th.text || '';
    BUBBLE.say(
      th.viewer || 0,
      txt,
      th.yOffset,
      th.xShift||0,
      typeof th.dur==='number' ? th.dur : null,
      typeof th.pauseAfter==='number' ? th.pauseAfter : null
    );
  }else if(th.kind==='bubbleDyn'){
    const dyn = (i18nDyn[LANG] && i18nDyn[LANG].thoughts) || {};
    const dur = (typeof th.dur==='number' ? th.dur : null);
    const pa  = (typeof th.pauseAfter==='number' ? th.pauseAfter : null);

    if(dyn[th.what]){
      const x0 = x0Val().toFixed(2);
      const phi0deg=((omega*obsStartPlaybackOffset)*180/Math.PI + 360)%360;
      let txt;
      if(th.what==='A'){
        txt = dyn.A(A_m.toFixed(2));
      }else if(th.what==='Tw'){
        txt = dyn.Tw(T.toFixed(2), omega.toFixed(3));
      }else if(th.what==='phi'){
        txt = dyn.phi(x0, phi0deg.toFixed(1));
      }
      BUBBLE.say(
        th.viewer || 0,
        txt || '',
        th.yOffset,
        th.xShift||0,
        dur,
        pa
      );
    }
  }else if(th.kind==='graph'){
    initXTChart(); drawXTChart();
  }else if(th.kind==='law'){
    if(th.lawText) addLaw(th.lawText);
    if(th.alsoParams){ showCurtainParams(); }
  }else if(th.kind==='lawPlot'){
    if(th.plot==='v')      ensureVelocityChart();
    else if(th.plot==='a') ensureAccelerationChart();
    else if(th.plot==='ax')ensureAxChart();
  }else if(th.kind==='close'){
    closeCurtainsSequence();
  }
}

/* ====== ANIMATION LOOP ====== */
let L0_px; let skaterWidthPx; let hookOffsetPx;
function animate(now){
  const realDt=(now-lastFrame)/1000; lastFrame=now;
  positionRightPanel(); updateRuler();

  const tPhys=(now-t0)/1000;
  if(!obsStarted){ playbackTime=tPhys; }
  else{ playbackTime += (mode==='run'? realDt : (mode==='slow'? realDt*slowFactor : 0)); }

  const tObs= obsStarted ? (playbackTime-obsStartPlaybackOffset) : 0;
  clockEl.textContent='t = '+tObs.toFixed(2)+' s';

  if(obsStarted && !isBubbleActive && nextThoughtIdx<thoughtScript.length){
    const th=thoughtScript[nextThoughtIdx];
    const shiftMul=(firstThoughtMul-DEFAULT_FIRST_MUL);
    const baseMul=(th.atT??0);
    const eventAtSec=(baseMul+shiftMul)*T*timelineScale;
    if(tObs>=eventAtSec){
      try{ handleTimelineEvent(th); }finally{ nextThoughtIdx+=1; }
    }
  }

  const springRect=springEl.getBoundingClientRect();
  const skRect=actor.getBoundingClientRect();
  if(!L0_px && springRect.width>0){ L0_px=springRect.width; }
  if(skRect.width>0){ skaterWidthPx=skRect.width; hookOffsetPx=skaterWidthPx/2; }

  const ax=anchorX();
  const centerX=stage.clientWidth/2;
  const skaterHookX=centerX + A_px*Math.sin(omega*playbackTime);
  const distance=skaterHookX-ax;
  const scale=(L0_px && L0_px>0) ? (distance/L0_px) : 1;
  springEl.style.left=ax+'px';
  springEl.style.transform=`scaleX(${scale})`;
  actor.style.transform='none';
  actor.style.left=(skaterHookX-hookOffsetPx)+'px';
  markerEl.style.left=skaterHookX+'px';
  spotlight.style.background=`radial-gradient(220px 140px at ${skaterHookX}px ${stage.clientHeight*0.62}px, rgba(255,255,220,.65), rgba(255,255,255,0) 70%)`;

  const xMeters=(skaterHookX-centerX)/pxPerMeter;
  logMeasurement(tObs,xMeters);

  requestAnimationFrame(animate);
}

function typeWriter(el, text, opt=12, done){
  el.innerHTML=''; let i=0;
  const src = String(text||'').replaceAll('sqrt(','√(');
  const total = src.length || 1;

  let speed;
  if(typeof opt === 'number'){
    speed = opt;
  }else if(opt && typeof opt === 'object'){
    const durSec = (typeof opt.durationSec==='number' && opt.durationSec>0) ? opt.durationSec : 2.0;
    const durMs  = durSec*1000;
    speed = Math.max(10, Math.round(durMs/total));
  }else{
    speed = 12;
  }

  (function tick(){
    el.innerHTML = src.slice(0,i).replaceAll('\n','<br>');
    try{
      boardLeft.scrollTop  = boardLeft.scrollHeight;
      boardRight.scrollTop = boardRight.scrollHeight;
    }catch(e){}
    i++;
    if(i<=src.length){
      setTimeout(tick, speed);
    }else{
      if(typeof done==='function') done();
    }
  })();
}

function isFormulaBlock(text){
  const s = String(text||'').trim();
  if(!s) return false;
  if(/^\(\d+\)/.test(s)) return true;
  if(/[ΑA]\.[ΔD]\.[ΜM]\.[ΕE]\.[ΤT]/.test(s)) return true;
  if(/M\.E\.C/.test(s)) return true;
  if(/[⇒⇔]/.test(s)) return true;
  if(/Νόμος του Νεύτωνα/i.test(s) || /Newton’s law/i.test(s)) return true;
  return false;
}

function addRow(leftText, rightText, viewer, durLeftSec, durRightSec, pauseAfterSec, whenDone){
  const baseViewer = Array.isArray(FOYER_VIEWERS) ? FOYER_VIEWERS : [];
  const viewerInfo = baseViewer.find(v=>v.id===viewer) || baseViewer[0] || {color:'#ffffff'};

  const bgLeft  = tint(viewerInfo.color, 0.22);
  const bgRight = tint(viewerInfo.color, 0.16);

  const l = document.createElement('div'); l.className='cell left sync-row';
  const r = document.createElement('div'); r.className='cell right sync-row';

  l.style.background = bgLeft;
  l.style.borderLeft = `4px solid ${tint(viewerInfo.color,0.85)}`;

  r.style.background = bgRight;
  r.style.borderLeft = `4px solid ${tint(viewerInfo.color,0.55)}`;

  if (isFormulaBlock(rightText)){
    r.classList.add('formula');
  }

  boardRight.appendChild(r);
  boardLeft.appendChild(l);

  showSpeakerChip(viewer);

  function finalizeRow(){
    requestAnimationFrame(()=>{
      const h = Math.max(l.offsetHeight, r.offsetHeight);
      l.style.minHeight = h+'px';
      r.style.minHeight = h+'px';
      boardLeft.scrollTop  = boardLeft.scrollHeight;
      boardRight.scrollTop = boardRight.scrollHeight;
      if(typeof whenDone==='function') whenDone(pauseAfterSec);
    });
  }

  const rt = (rightText||'').trim();

  const leftOpt  = (typeof durLeftSec  === 'number' && durLeftSec>0)  ? {durationSec:durLeftSec}  : 10;
  const rightOpt = (typeof durRightSec === 'number' && durRightSec>0) ? {durationSec:durRightSec} : 10;

  typeWriter(l, leftText, leftOpt, ()=>{
    if(rt.length>0){
      typeWriter(r, rightText, rightOpt, finalizeRow);
    }else{
      finalizeRow();
    }
  });
}

function foyerStep(){
  const dlgLang = DIALOGS[LANG];
  if(!dlgLang || !Array.isArray(dlgLang.foyer)) return;

  const lines = dlgLang.foyer || [];
  const text  = lines[foyerIdx] || null;

  if(!text){
    if(foyerIdx >= lines.length){
      foyerAuto=false;
    }
    return;
  }

  let viewerId = 1;
  if(typeof text.viewer === 'number') viewerId = text.viewer;

  let durLeftSec, durRightSec;
  if(typeof text.typeMs === 'number'){
    durLeftSec  = text.typeMs / 1000;
    durRightSec = text.typeMs / 1000;
  }

  let pauseAfterSec;
  if(typeof text.pauseMs === 'number'){
    pauseAfterSec = text.pauseMs / 1000;
  }

  foyerIdx++;

  addRow(
    text.left || '',
    text.right || '',
    viewerId,
    durLeftSec,
    durRightSec,
    pauseAfterSec,
    (pause)=>{
      const len = (String(text.left||'').length + String(text.right||'').length);
      let delay;
      if(typeof pause === 'number'){
        delay = Math.max(0, pause*1000);
      }else{
        const baseDelay = 600;
        const extra     = Math.min(2000, Math.max(400, 15*len/4));
        delay = baseDelay + extra;

      if(foyerAuto){
        foyerTimer = setTimeout(foyerStep, delay);
      }
    }
  );
}

(function(){
  let ghost=null, ghostSpring=null, ghostRAF=0;
  const Aghost_m=5.0;
  function getBottom(el){ return parseFloat(getComputedStyle(el).bottom||'0')||0; }
  function ensureGhost(){
    if(!ghost){
      ghost=document.createElement('div'); ghost.id='actorGhost';
      Object.assign(ghost.style,{position:'absolute', transform:'translate(-50%,0)', zIndex:121, pointerEvents:'none', opacity:0.85, filter:'grayscale(1) brightness(1.2)', display:'none'});
      const src=actor.querySelector('img'); const img=document.createElement('img'); img.src=src?src.src:''; img.style.width='100%'; img.style.height='auto';
      ghost.appendChild(img); stage.appendChild(ghost);
    }
    if(!ghostSpring){
      ghostSpring=document.createElement('img'); ghostSpring.id='springGhost';
      ghostSpring.src = springEl ? springEl.src : '';
      Object.assign(ghostSpring.style,{position:'absolute', transformOrigin:'left center', zIndex:120, pointerEvents:'none', opacity:0.9, filter:'grayscale(1) brightness(1.15)', display:'none'});
      stage.appendChild(ghostSpring);
    }
    const sRect=springEl.getBoundingClientRect();
    ghostSpring.style.bottom=getBottom(springEl)+'px';
    ghostSpring.style.height=sRect.height+'px';
    ghostSpring.style.left=anchorX()+'px';
    ghostSpring.style.transform='scaleX(1)';
    const aRect=actor.getBoundingClientRect();
    ghost.style.bottom=getBottom(actor)+'px';
    ghost.style.width=aRect.width+'px';
    ghost.style.height=aRect.height+'px';
  }
  function startGhost(){
    ensureGhost();
    ghost.style.display='block';
    ghostSpring.style.display='block';
    cancelAnimationFrame(ghostRAF);

    const A_real_px  = pxPerMeter * A_m;
    const A_ghost_px = pxPerMeter * Aghost_m;

    const loop=()=>{
      const sRect = stage.getBoundingClientRect();
      const aRect = actor.getBoundingClientRect();
      const cx    = stage.clientWidth/2;
      const ax    = anchorX();

      const hookX_real = (aRect.left - sRect.left) + aRect.width/2;
      const sinθ = Math.max(-1, Math.min(1, (hookX_real - cx) / Math.max(1, A_real_px)));
      const hookX_ghost = cx + A_ghost_px * sinθ;

      ghost.style.left = hookX_ghost + 'px';

      const base = L0_px || ghostSpring.getBoundingClientRect().width || 1;
      const dist  = Math.max(0, hookX_ghost - ax);
      const scale = dist / base;
      ghostSpring.style.left = ax + 'px';
      ghostSpring.style.transform = `scaleX(${scale})`;

      ghostRAF = requestAnimationFrame(loop);
    };
    ghostRAF = requestAnimationFrame(loop);
  }
  function stopGhost(){
    cancelAnimationFrame(ghostRAF); ghostRAF=0;
    if(ghost){ ghost.style.display='none'; }
    if(ghostSpring){ ghostSpring.style.display='none'; ghostSpring.style.transform='scaleX(1)'; }
  }

  let running=false, finished=false;

  async function playAct2(){
    if(running || finished) return;
    const seq = Array.isArray(ACT2_TIMELINE) ? ACT2_TIMELINE : [];
    if(!seq.length){ finished=true; return; }

    running=true;
    try{
      actBreak.style.display='none';
      BUBBLE.clear();
      stage.classList.add('open');
      springEl.style.display='block';

      const ui = UI[LANG] || {};
      const actTitleEl = document.querySelector('[data-i18n="actTitle"]');
      const sbA = document.getElementById('sbLineA');
      const sbB = document.getElementById('sbLineB');
      const sbC = document.getElementById('sbLineC');
      const sbD = document.getElementById('sbLineD');

      if(actTitleEl && ui.act2Title) actTitleEl.textContent = ui.act2Title;
      if(sbA && ui.sbA2) sbA.textContent = ui.sbA2;
      if(sbB && ui.sbB2) sbB.innerHTML   = ui.sbB2;
      if(sbC && ui.sbC2) sbC.textContent = ui.sbC2;
      if(sbD && ui.sbD2) sbD.textContent = ui.sbD2;

      for(const step of seq){
        if(step.lawText){
          addLaw(step.lawText);
          await new Promise(r=>setTimeout(r,220));
          continue;
        }

        const viewerIdx = (typeof step.viewer==='number' ? step.viewer : 0);
        const yOff = (typeof step.yOffset==='number' ? step.yOffset :
                      (typeof step.y==='number' ? step.y : 135));
        const xShift = (typeof step.xShift==='number' ? step.xShift :
                        (typeof step.x==='number' ? step.x : 0));

        if(step.gStart) startGhost();
        await BUBBLE.say(
          viewerIdx,
          step.text || '',
          yOff,
          xShift,
          typeof step.dur==='number' ? step.dur : null,
          typeof step.pauseAfter==='number' ? step.pauseAfter : null
        );
        if(step.gStop)  stopGhost();
      }

      markerEl.style.opacity='0';
      curtainUpper.classList.add('slow-close');
      stage.classList.remove('open');
      await new Promise(r=>setTimeout(r,1600));
      curtainUpper.classList.remove('slow-close');

      const cuRect = curtainUpper.getBoundingClientRect();
      const sRect = stage.getBoundingClientRect();
      const centralLeftPx = sRect.left + stage.clientWidth*0.18;
      const centralWidthPx = stage.clientWidth*0.64;
      foyerBreak.style.left   = (centralLeftPx - sRect.left) + 'px';
      foyerBreak.style.top    = (cuRect.top  - sRect.top ) + 'px';
      foyerBreak.style.width  = centralWidthPx + 'px';
      foyerBreak.style.height = cuRect.height + 'px';
      foyerBreak.style.display='flex';

      finished=true;
    }catch(e){
      console.error(e);
    }finally{
      running=false;
    }
  }
  document.addEventListener('act2-start', playAct2, { once:true });
  document.getElementById('btnAct2').addEventListener('click', ()=>document.dispatchEvent(new Event('act2-start')));
})();

/* ====== LANG SWITCH HANDLER ====== */
langSwitch.addEventListener('click', async (e)=>{
  const btn=e.target.closest('button[data-lang]'); if(!btn) return;
  [...langSwitch.querySelectorAll('button')].forEach(b=>b.classList.toggle('on', b===btn));
  const lang = btn.dataset.lang;
  await loadDialogOverrides(lang);
  setLang(lang);
});

/* ====== RESIZE OBSERVER ====== */
const ro=new ResizeObserver(()=>{ positionRightPanel(); if(uXT){ drawXTChart(); } positionLawCharts(); positionParamsBox(); repositionFoyer(); });
ro.observe(stage);

/* ====== BOOTSTRAP ====== */
(async ()=>{
  await loadDialogOverrides('gr');
  await loadDialogOverrides('en');
  setLang('gr');
  applyViewersToDom();
  resetShow();
})();
</script>
