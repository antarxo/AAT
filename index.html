<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Θεατρική Σκηνή — Ενιαία Έκδοση (Act I + Act II + Φουαγιέ)</title>

  <link rel="stylesheet" href="https://unpkg.com/uplot@1.6.30/dist/uPlot.min.css">
  <script src="https://unpkg.com/uplot@1.6.30/dist/uPlot.iife.min.js"></script>

  <style>
    :root{
      --foyer-h: 445px;
    }

    body{
      margin:0;
      background:radial-gradient(circle at center,#222 0%,#000 100%);
      overflow:hidden;
      font-family:Inter,system-ui,sans-serif;
      color:#f5f5f5;
    }

    .stage{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
    }

    /* Σκηνικά */
    #mainScene{
      position:absolute;
      inset:0;
      overflow:hidden;
    }

    #sceneBg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:100;
    }

    #koinoExtra{
      position:absolute;
      left:50%;
      bottom:0;
      transform:translateX(-50%);
      width:70vw;
      max-width:1200px;
      z-index:1300; /* κάτω από ομιλητές */
      pointer-events:none;
    }

    #koino{
      position:absolute;
      left:50%;
      bottom:0;
      transform:translateX(-50%);
      width:70vw;
      max-width:1200px;
      z-index:1500; /* κοινό πάνω από extra, κάτω από controls */
      pointer-events:none;
    }

    /* Bubble σκηνής (1η & 2η πράξη) */
    #bubble{
      position:absolute;
      min-width:200px;
      max-width:380px;
      padding:12px 14px;
      border-radius:16px;
      background:rgba(0,0,0,0.8);
      border:1px solid rgba(255,255,255,0.3);
      box-shadow:0 8px 18px rgba(0,0,0,0.7);
      display:none;
    }

    #bubbleText{
      font-size:14px;
      line-height:1.4;
    }

    /* Πλαίσιο νόμων / τύπων */
    #lawPanel{
      position:absolute;
      top:6%;
      right:4%;
      width:28%;
      min-width:260px;
      max-width:380px;
      height:34%;
      padding:10px 12px;
      background:rgba(12,12,18,0.9);
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.2);
      box-shadow:0 8px 18px rgba(0,0,0,0.6);
      z-index:1200;
      overflow:auto;
    }

    #lawText{
      font-size:13px;
      line-height:1.4;
      white-space:pre-wrap;
    }

    /* Πάνελ γραφήματος */
    #graphPanel{
      position:absolute;
      bottom:6%;
      right:4%;
      width:28%;
      min-width:260px;
      max-width:380px;
      height:32%;
      padding:6px;
      background:rgba(8,8,12,0.9);
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 8px 18px rgba(0,0,0,0.6);
      z-index:1100;
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    #graphTitle{
      font-size:12px;
      opacity:0.8;
    }

    #plotContainer{
      flex:1;
      min-height:120px;
    }

    /* Φουαγιέ */
    #foyerPanel{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:var(--foyer-h);
      background:linear-gradient(to top,rgba(10,10,14,0.98),rgba(10,10,14,0.94));
      border-top:1px solid rgba(255,255,255,0.2);
      display:none;
      z-index:1000;
      padding:12px 26px 10px 26px;
      box-sizing:border-box;
    }

    #foyerInner{
      position:relative;
      width:100%;
      height:100%;
      display:grid;
      grid-template-columns:1.4fr 1.1fr;
      gap:18px;
    }

    #foyerLeftText,
    #foyerRightText{
      font-size:14px;
      line-height:1.4;
      white-space:pre-wrap;
      overflow:auto;
      padding:8px 10px;
      border-radius:12px;
      background:rgba(0,0,0,0.4);
      border:1px solid rgba(255,255,255,0.15);
    }

    /* Avatars ομιλητών (φουαγιέ) */
    .foyer-avatar{
      position:absolute;
      bottom:8px;
      width:72px;
      height:auto;
      transform:translateX(-50%);
      opacity:0;
      display:none;
      transition:opacity 0.4s;
      z-index:1400;
      pointer-events:none;
    }

    .foyer-avatar[data-viewer="1"]{ left:16%; }
    .foyer-avatar[data-viewer="2"]{ left:32%; }
    .foyer-avatar[data-viewer="3"]{ left:50%; }
    .foyer-avatar[data-viewer="4"]{ left:68%; }
    .foyer-avatar[data-viewer="5"]{ left:84%; }

    /* Controls */
    #controls{
      position:absolute;
      top:10px;
      left:50%;
      transform:translateX(-50%);
      display:flex;
      gap:10px;
      z-index:2000;
    }

    #controls button{
      padding:6px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.3);
      background:rgba(0,0,0,0.7);
      color:#f5f5f5;
      font-size:13px;
      cursor:pointer;
      backdrop-filter:blur(8px);
    }

    #controls button:hover{
      background:rgba(255,255,255,0.1);
    }

    #controls button.active{
      background:#f5f5f5;
      color:#000;
    }

  </style>
</head>
<body>
  <div class="stage">

    <!-- Σκηνικά -->
    <div id="mainScene">
      <img id="sceneBg" src="scene_bg.png" alt="Σκηνικό" />

      <img id="koinoExtra" src="koino_extra.png" alt="Επέκταση κοινού" />
      <img id="koino" src="koino.png" alt="Κοινό" />

      <div id="lawPanel">
        <div id="lawText"></div>
      </div>

      <div id="graphPanel">
        <div id="graphTitle">Διάγραμμα</div>
        <div id="plotContainer"></div>
      </div>

      <div id="bubble">
        <div id="bubbleText"></div>
      </div>
    </div>

    <!-- Φουαγιέ -->
    <div id="foyerPanel">
      <div id="foyerInner">
        <div id="foyerLeftText"></div>
        <div id="foyerRightText"></div>

        <!-- Avatars θεατών -->
        <img class="foyer-avatar" data-viewer="1" src="viewer1.png" alt="Θεατής 1" />
        <img class="foyer-avatar" data-viewer="2" src="viewer2.png" alt="Θεατής 2" />
        <img class="foyer-avatar" data-viewer="3" src="viewer3.png" alt="Θεατής 3" />
        <img class="foyer-avatar" data-viewer="4" src="viewer4.png" alt="Θεατής 4" />
        <img class="foyer-avatar" data-viewer="5" src="viewer5.png" alt="Θεατής 5" />
      </div>
    </div>

    <!-- Κουμπιά -->
    <div id="controls">
      <button id="btnAct1">1η Πράξη</button>
      <button id="btnAct2">2η Πράξη</button>
      <button id="btnFoyer">Φουαγιέ</button>
    </div>
  </div>

  <script>
  'use strict';

  // ---------------- ΓΕΝΙΚΑ ΔΕΔΟΜΕΝΑ ΔΙΑΛΟΓΩΝ ----------------

  let DIALOGS = null;
  let currentActKey = null;
  let currentSeq = [];
  let currentSeqIndex = 0;
  let currentLang = "gr";

  // φόρτωση dialogs-XX.json
  async function loadDialogs(lang) {
    if (DIALOGS && currentLang === lang) return DIALOGS;
    const response = await fetch("dialogs-" + lang + ".json?ts=" + Date.now());
    DIALOGS = await response.json();
    currentLang = lang;
    return DIALOGS;
  }

  // meta θεατών από "viewers" του JSON
  function getViewerMeta(viewerIndex) {
    if (!DIALOGS || !DIALOGS.viewers) return null;
    var idx = (viewerIndex || 0) - 1; // JSON: 1..5 → index 0..4
    if (idx < 0 || idx >= DIALOGS.viewers.length) return null;
    return DIALOGS.viewers[idx];
  }

  // ---------------- ΒΟΗΘΗΤΙΚΑ LAYOUT / PANELS ----------------

  function showFoyerPanel(show) {
    var foyer = document.getElementById("foyerPanel");
    var mainScene = document.getElementById("mainScene");
    if (!foyer || !mainScene) return;
    if (show) {
      foyer.style.display = "block";
    } else {
      foyer.style.display = "none";
    }
  }

  function resetStageBubble() {
    var bubbleEl = document.getElementById("bubble");
    var bubbleTextEl = document.getElementById("bubbleText");
    if (bubbleEl) {
      bubbleEl.style.display = "none";
    }
    if (bubbleTextEl) {
      bubbleTextEl.innerHTML = "";
    }
  }

  function resetLawPanel() {
    var lawTextEl = document.getElementById("lawText");
    if (lawTextEl) {
      lawTextEl.innerHTML = "";
    }
  }

  function resetFoyerTexts() {
    var leftEl = document.getElementById("foyerLeftText");
    var rightEl = document.getElementById("foyerRightText");
    if (leftEl) leftEl.innerHTML = "";
    if (rightEl) rightEl.innerHTML = "";
  }

  function resetFoyerAvatars() {
    var avatars = document.querySelectorAll(".foyer-avatar");
    for (var i = 0; i < avatars.length; i++) {
      avatars[i].style.display = "none";
      avatars[i].style.opacity = 0;
    }
  }

  // ---------------- ΤΟΠΟΘΕΤΗΣΗ BUBBLES / AVATARS ----------------

  // Bubble σκηνής (1η & 2η πράξη) — υπολογισμός από ΚΑΤΩ μέρος του koino
  function positionStageBubble(entry) {
    var bubbleEl = document.getElementById("bubble");
    var koinoEl = document.getElementById("koino");
    if (!bubbleEl || !koinoEl) return;
    if (!entry || !entry.viewer) return;

    var viewerMeta = getViewerMeta(entry.viewer);
    if (!viewerMeta) return;

    var rect = koinoEl.getBoundingClientRect();

    var xFrac = viewerMeta.xFrac || 0.5;
    var baseX = rect.left + rect.width * xFrac;
    var x = baseX + (entry.xShift || 0);

    var baseY = rect.bottom;
    var y = baseY - (entry.yOffset || 0);

    bubbleEl.style.left = x + "px";
    bubbleEl.style.top = y + "px";
    bubbleEl.style.zIndex = 1400; // ομιλητές
  }

  // Ενεργός ομιλητής στο φουαγιέ (εμφάνιση μόνο ενός avatar)
  function setActiveFoyerViewer(viewerIndex) {
    resetFoyerAvatars();
    if (!viewerIndex) return;
    var selector = '.foyer-avatar[data-viewer="' + viewerIndex + '"]';
    var target = document.querySelector(selector);
    if (!target) return;
    target.style.display = "block";
    // μικρό timeout για smooth opacity (προαιρετικό)
    setTimeout(function(){
      target.style.opacity = 1;
    }, 10);
  }

  // ---------------- TYPEWRITER ΕΦΕ ----------------

  function typewriter(el, html, durationMs, cb) {
    if (!el) {
      if (cb) cb();
      return;
    }
    var text = html || "";
    if (durationMs <= 0 || text.length === 0) {
      el.innerHTML = text;
      if (cb) cb();
      return;
    }

    el.innerHTML = "";
    var totalChars = text.length;
    var stepMs = Math.max(15, durationMs / Math.max(totalChars, 1));
    var i = 0;

    function step() {
      i++;
      el.innerHTML = text.slice(0, i);
      if (i < totalChars) {
        setTimeout(step, stepMs);
      } else {
        if (cb) cb();
      }
    }

    step();
  }

  // ---------------- ΓΡΑΦΗΜΑΤΑ (απλό setup με uPlot) ----------------

  var currentPlot = null;
  var currentGraphKind = null;

  function buildDataFor(kind) {
    // πολύ απλό demo: Α=1, ω=1
    var A = 1;
    var w = 1;
    var N = 200;
    var t = [];
    var x = [];
    var v = [];
    var a = [];
    var ax = [];

    for (var i = 0; i < N; i++) {
      var tt = i * 0.05;
      var xt = A * Math.sin(w * tt);
      var vt = w * A * Math.cos(w * tt);
      var at = -w * w * A * Math.sin(w * tt);
      t.push(tt);
      x.push(xt);
      v.push(vt);
      a.push(at);
      ax.push(at); // απλά ίδιο για demo
    }

    return {
      t: t,
      x: x,
      v: v,
      a: a,
      ax: ax
    };
  }

  function showGraph(kind) {
    var container = document.getElementById("plotContainer");
    var titleEl = document.getElementById("graphTitle");
    if (!container) return;

    var data = buildDataFor(kind);

    var series;
    var title;
    if (kind === "xt") {
      series = [
        {},
        { label:"x(t)" }
      ];
      title = "x–t";
    } else {
      // default
      series = [
        {},
        { label:"x(t)" }
      ];
      title = "x–t";
    }

    if (titleEl) {
      titleEl.textContent = "Διάγραμμα " + title;
    }

    if (currentPlot) {
      currentPlot.destroy();
      currentPlot = null;
    }

    currentPlot = new uPlot({
      width: container.clientWidth || 260,
      height: container.clientHeight || 150,
      series: series,
      axes: [
        {},
        {}
      ]
    }, [data.t, data.x], container);

    currentGraphKind = kind;
  }

  function showLawPlot(plotKey) {
    var container = document.getElementById("plotContainer");
    var titleEl = document.getElementById("graphTitle");
    if (!container) return;

    var data = buildDataFor("xt");

    var y;
    var label;
    var title;
    if (plotKey === "v") {
      y = data.v;
      label = "v(t)";
      title = "v–t";
    } else if (plotKey === "a") {
      y = data.a;
      label = "a(t)";
      title = "a–t";
    } else if (plotKey === "ax") {
      y = data.ax;
      label = "a(x)";
      title = "a–x (προσομοίωση)";
    } else {
      y = data.x;
      label = "x(t)";
      title = "x–t";
    }

    if (titleEl) {
      titleEl.textContent = "Διάγραμμα " + title;
    }

    if (currentPlot) {
      currentPlot.destroy();
      currentPlot = null;
    }

    currentPlot = new uPlot({
      width: container.clientWidth || 260,
      height: container.clientHeight || 150,
      series: [
        {},
        { label: label }
      ],
      axes: [
        {},
        {}
      ]
    }, [data.t, y], container);
  }

  // param bubble (π.χ. φ, Α, Tw) – εδώ απλή υλοποίηση
  function showParamBubble(paramKey, viewerIndex) {
    // μπορείς αργότερα να το εξελίξεις σε ξεχωριστό overlay
    var lawTextEl = document.getElementById("lawText");
    if (!lawTextEl) return;
    var txt;
    if (paramKey === "phi") {
      txt = "Ρύθμιση φάσης φ₀";
    } else if (paramKey === "A") {
      txt = "Ρύθμιση πλάτους A";
    } else if (paramKey === "Tw") {
      txt = "Ρύθμιση περιόδου T / γωνιακής συχνότητας ω";
    } else {
      txt = "Παράμετρος: " + paramKey;
    }
    lawTextEl.innerHTML = txt;
  }

  // Ghost σκηνή (2η πράξη) – stubs, για να μην σπάνε τα flags
  function startGhostScene() {
    // βάλε εδώ ό,τι είχες για την ghost σκηνή
  }

  function stopGhostScene() {
    // αντίστοιχα
  }

  function onActFinished(actKey) {
    // callback στο τέλος πράξης, αν χρειαστεί
  }

  // ---------------- RENDER ENTRIES ----------------

  function renderStageEntry(entry) {
    var bubbleEl     = document.getElementById("bubble");
    var bubbleTextEl = document.getElementById("bubbleText");
    var lawTextEl    = document.getElementById("lawText");

    resetStageBubble();
    // νόμοι: δεν καθαρίζω πάντα, για να μπορείς να "κρατάς" προηγούμενους αν θέλεις.
    // Αν θες να καθαρίζει σε κάθε βήμα, βάλε resetLawPanel() εδώ.

    // 1. Bubble (σκέψη/ατάκα) αν έχει left + viewer
    if (entry.left && entry.viewer) {
      positionStageBubble(entry);
      if (bubbleEl) {
        bubbleEl.style.display = "block";
        bubbleEl.style.zIndex = 1400;
      }
      typewriter(
        bubbleTextEl,
        entry.left,
        entry.typeMs || 0,
        null
      );
    }

    // 2. Νόμοι / τύποι (right)
    if (entry.right && lawTextEl) {
      typewriter(
        lawTextEl,
        entry.right,
        entry.typeMs || 0,
        null
      );
    }

    // 3. Δυναμικές παράμετροι
    if (entry.param) {
      showParamBubble(entry.param, entry.viewer || null);
    }

    // 4. Γραφήματα
    if (entry.graph) {
      showGraph(entry.graph);
    }

    // 5. Plot επιλογή
    if (entry.plot) {
      showLawPlot(entry.plot);
    }

    // 6. Ghost flags
    if (entry.gStart) {
      startGhostScene();
    }
    if (entry.gStop) {
      stopGhostScene();
    }

    // 7. Close flag
    if (entry.close) {
      onActFinished(currentActKey);
    }
  }

  function renderFoyerEntry(entry) {
    var leftEl  = document.getElementById("foyerLeftText");
    var rightEl = document.getElementById("foyerRightText");

    setActiveFoyerViewer(entry.viewer || null);

    typewriter(
      leftEl,
      entry.left || "",
      entry.typeMs || 0,
      null
    );

    typewriter(
      rightEl,
      entry.right || "",
      entry.typeMs || 0,
      null
    );
  }

  // ---------------- SEQUENCE ENGINE (ΜΙΑ ΣΥΝΑΡΤΗΣΗ ΓΙΑ ΟΛΑ) ----------------

  function stepSequence() {
    if (!currentSeq || currentSeqIndex >= currentSeq.length) {
      onActFinished(currentActKey);
      return;
    }

    var entry = currentSeq[currentSeqIndex];

    if (currentActKey === "foyer") {
      renderFoyerEntry(entry);
    } else {
      renderStageEntry(entry);
    }

    var totalMs = (entry.typeMs || 0) + (entry.pauseMs || 0);
    if (totalMs <= 0) totalMs = 800;

    currentSeqIndex++;
    setTimeout(stepSequence, totalMs);
  }

  async function playSequence(actKey, lang) {
    if (!lang) lang = "gr";
    await loadDialogs(lang);

    currentActKey   = actKey;
    currentSeq      = DIALOGS[actKey] || [];
    currentSeqIndex = 0;

    // reset UI ανά act
    resetStageBubble();
    resetLawPanel();
    resetFoyerTexts();
    resetFoyerAvatars();

    if (actKey === "foyer") {
      showFoyerPanel(true);
    } else {
      showFoyerPanel(false);
    }

    stepSequence();
  }

  // ---------------- CONTROLS ----------------

  function setActiveButton(btnId) {
    var buttons = document.querySelectorAll("#controls button");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.remove("active");
    }
    var btn = document.getElementById(btnId);
    if (btn) btn.classList.add("active");
  }

  document.addEventListener("DOMContentLoaded", function(){
    var btnAct1  = document.getElementById("btnAct1");
    var btnAct2  = document.getElementById("btnAct2");
    var btnFoyer = document.getElementById("btnFoyer");

    if (btnAct1) {
      btnAct1.addEventListener("click", function(){
        setActiveButton("btnAct1");
        playSequence("act1", "gr");
      });
    }

    if (btnAct2) {
      btnAct2.addEventListener("click", function(){
        setActiveButton("btnAct2");
        playSequence("act2", "gr");
      });
    }

    if (btnFoyer) {
      btnFoyer.addEventListener("click", function(){
        setActiveButton("btnFoyer");
        playSequence("foyer", "gr");
      });
    }
  });
  </script>
</body>
</html>
