<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Θεατρική Σκηνή — ΑΑΤ</title>

  <!-- uPlot για τα διαγράμματα (κρατάμε όπως πριν, έστω και αν δεν το ζορίσουμε τώρα) -->
  <link rel="stylesheet" href="https://unpkg.com/uplot@1.6.30/dist/uPlot.min.css">
  <script src="https://unpkg.com/uplot@1.6.30/dist/uPlot.iife.min.js"></script>

  <style>
    :root {
      --foyer-h: 445px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at center,#222 0%,#000 100%);
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f5f5;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Σκηνικό */

    .backdrop {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, #555 0%, #111 55%, #000 100%);
      z-index: 200;
    }

    .floor {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 140%;
      height: 28%;
      background: linear-gradient(to top, #26140e 0%, #3b2117 40%, transparent 100%);
      z-index: 210;
    }

    .board {
      position: absolute;
      left: 50%;
      top: 9%;
      transform: translateX(-50%);
      width: 58%;
      height: 32%;
      background: #111;
      border-radius: 14px;
      border: 3px solid #444;
      box-shadow:
        0 0 40px rgba(0,0,0,0.8),
        0 0 80px rgba(0,0,0,0.8) inset;
      z-index: 300;
    }

    /* Περιοχή διαγραμμάτων πάνω στον πίνακα */

    .graph-zone {
      position: absolute;
      inset: 8% 4%;
      border-radius: 8px;
      overflow: hidden;
    }

    #uplot-container {
      width: 100%;
      height: 100%;
    }

    /* Κουρτίνες (αν κρατήσεις animation κ.λπ. μπορείς να επεκτείνεις εδώ) */

    .curtain-top,
    .curtain-upper,
    .curtain-side {
      position: absolute;
      transition: transform 1.2s cubic-bezier(.2,.9,.2,1),opacity 1s;
      pointer-events: none;
      z-index: 800;
    }

    .curtain-top {
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background: radial-gradient(circle at top,#b00020,#5c0010);
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      transform-origin: top;
    }

    .curtain-upper {
      top: 80px;
      left: 0;
      right: 0;
      height: 70px;
      background: repeating-linear-gradient(
        90deg,
        #b00020 0 60px,
        #7a0016 60px 120px
      );
      box-shadow: 0 8px 20px rgba(0,0,0,0.7);
      transform-origin: top;
    }

    .curtain-side {
      top: 0;
      bottom: 0;
      width: 110px;
      background: repeating-linear-gradient(
        180deg,
        #b00020 0 70px,
        #7a0016 70px 140px
      );
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
    }

    .curtain-left {
      left: 0;
      transform-origin: left;
    }

    .curtain-right {
      right: 0;
      transform-origin: right;
    }

    /* Κοινό */

    .audience-wrap {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 80vw;
      max-width: 1100px;
      z-index: 1500; /* όπως ζητήθηκε: κοινό πάνω από τους θεατές-avatars */
      pointer-events: none;
    }

    #koino-extra {
      position: absolute;
      inset: 0;
      object-fit: contain;
      width: 100%;
      height: auto;
      z-index: 1300; /* πίσω από avatars */
      pointer-events: none;
      opacity: 0.85;
    }

    #koino {
      position: relative;
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }

    /* Avatars θεατών στο φουαγιέ + κοινό */

    #viewer-avatars {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      top: 0;
      pointer-events: none;
      z-index: 1400; /* όπως ζητήθηκε: μετά το κοινό (1500), πριν τα κουμπιά (2000) */
    }

    .viewer-avatar {
      position: absolute;
      transform-origin: bottom center;
      display: none;
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.9));
    }

    .viewer-avatar.speaking {
      filter:
        drop-shadow(0 0 6px rgba(255,255,255,0.8))
        drop-shadow(0 0 14px rgba(255,255,0,0.75));
    }

    /* Bubbles σκέψεων / λόγου */

    .viewer-bubble {
      position: absolute;
      max-width: 260px;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(20,20,20,0.95);
      border: 2px solid rgba(255,255,255,0.15);
      box-shadow:
        0 0 18px rgba(0,0,0,0.8),
        0 0 9px rgba(0,0,0,0.9) inset;
      font-size: 13px;
      line-height: 1.4;
      z-index: 1600; /* πάνω από κοινό / avatars */
      display: none;
    }

    .viewer-bubble::after {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 18px;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 12px solid rgba(20,20,20,0.95);
    }

    .viewer-bubble strong,
    .viewer-bubble b {
      color: #ffd54f;
    }

    /* Foyer panel κάτω */

    .foyer-panel {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 100%;
      max-width: 1200px;
      height: var(--foyer-h);
      background: linear-gradient(to top, rgba(10,10,10,0.98), rgba(10,10,10,0.96));
      box-shadow: 0 -10px 25px rgba(0,0,0,0.9);
      border-top: 2px solid rgba(255,255,255,0.08);
      display: none;
      z-index: 1700;
    }

    .foyer-inner {
      display: flex;
      height: 100%;
      padding: 16px 22px 18px;
      gap: 16px;
    }

    .foyer-col {
      flex: 1;
      background: radial-gradient(circle at top, #1f2933 0%, #111822 55%, #05070b 100%);
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 0 20px rgba(0,0,0,0.8),
        0 0 10px rgba(0,0,0,0.9) inset;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .foyer-title {
      font-size: 13px;
      opacity: 0.9;
      margin-bottom: 4px;
      color: #cbd5f5;
    }

    .foyer-body {
      font-size: 14px;
    }

    /* Κουμπιά ελέγχου */

    .controls {
      position: absolute;
      top: 10px;
      right: 14px;
      display: flex;
      gap: 6px;
      z-index: 2000; /* top */
    }

    .btn {
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(10,10,10,0.85);
      color: #f5f5f5;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      user-select: none;
    }

    .btn span {
      font-size: 14px;
    }

    .btn:hover {
      background: rgba(40,40,40,0.9);
    }

    .btn.active {
      background: #2563eb;
      border-color: #93c5fd;
    }

    .btn-danger {
      border-color: #f97373;
      color: #fecaca;
    }

    .btn-danger:hover {
      background: #7f1d1d;
    }

    /* Λίγο info κάτω αριστερά */

    .act-label {
      position: absolute;
      left: 14px;
      bottom: 12px;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.1);
      z-index: 2000;
    }

    .act-label strong {
      color: #93c5fd;
    }

    /* Scrollbars στο foyer */

    .foyer-col::-webkit-scrollbar {
      width: 6px;
    }
    .foyer-col::-webkit-scrollbar-track {
      background: transparent;
    }
    .foyer-col::-webkit-scrollbar-thumb {
      background: rgba(148,163,184,0.5);
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="backdrop"></div>
    <div class="floor"></div>

    <div class="board">
      <div class="graph-zone">
        <div id="uplot-container"></div>
      </div>
    </div>

    <!-- Κουρτίνες -->
    <div class="curtain-top"></div>
    <div class="curtain-upper"></div>
    <div class="curtain-side curtain-left"></div>
    <div class="curtain-side curtain-right"></div>

    <!-- Κοινό -->
    <div class="audience-wrap">
      <img id="koino-extra" src="koino_extra.png" alt="">
      <img id="koino" src="koino.png" alt="Κοινό">
    </div>

    <!-- Avatars θεατών (πάνω/γύρω από το κοινό) -->
    <div id="viewer-avatars"></div>

    <!-- Bubbles για όλους τους θεατές -->
    <div id="viewer-bubbles-container"></div>

    <!-- Foyer panel -->
    <div class="foyer-panel" id="foyer-panel">
      <div class="foyer-inner">
        <div class="foyer-col">
          <div class="foyer-title">Αριστερά</div>
          <div class="foyer-body" id="foyer-left"></div>
        </div>
        <div class="foyer-col">
          <div class="foyer-title">Δεξιά</div>
          <div class="foyer-body" id="foyer-right"></div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn" id="btn-act1"><span>🎭</span> Πράξη 1</button>
      <button class="btn" id="btn-act2"><span>🎭</span> Πράξη 2</button>
      <button class="btn" id="btn-foyer"><span>💬</span> Φουαγιέ</button>
      <button class="btn btn-danger" id="btn-stop"><span>⏹</span> Stop</button>
    </div>

    <div class="act-label" id="act-label">
      <span>Τρέχουσα σκηνή: <strong>-</strong></span>
    </div>
  </div>

  <script>
    // ---------------- Γενικά state ----------------

    var dialogsData = null;
    var currentAct = null;
    var actTimeouts = [];
    var foyerIndex = 0;
    var foyerRunning = false;
    var uplot = null;

    // cache selectors
    var koinoImg;
    var koinoExtraImg;
    var avatarsContainer;
    var bubblesContainer;
    var foyerPanel;
    var foyerLeftEl;
    var foyerRightEl;
    var actLabelEl;

    var viewersById = {};

    document.addEventListener('DOMContentLoaded', function () {
      koinoImg = document.getElementById('koino');
      koinoExtraImg = document.getElementById('koino-extra');
      avatarsContainer = document.getElementById('viewer-avatars');
      bubblesContainer = document.getElementById('viewer-bubbles-container');
      foyerPanel = document.getElementById('foyer-panel');
      foyerLeftEl = document.getElementById('foyer-left');
      foyerRightEl = document.getElementById('foyer-right');
      actLabelEl = document.getElementById('act-label').querySelector('strong');

      setupButtons();
      loadDialogs();
      window.addEventListener('resize', function () {
        repositionAllAvatars();
        repositionAllBubbles();
      });
    });

    function setupButtons() {
      var b1 = document.getElementById('btn-act1');
      var b2 = document.getElementById('btn-act2');
      var bf = document.getElementById('btn-foyer');
      var bs = document.getElementById('btn-stop');

      b1.addEventListener('click', function () {
        if (!dialogsData) return;
        playAct('act1');
        setActiveBtn('btn-act1');
      });
      b2.addEventListener('click', function () {
        if (!dialogsData) return;
        playAct('act2');
        setActiveBtn('btn-act2');
      });
      bf.addEventListener('click', function () {
        if (!dialogsData) return;
        playFoyer();
        setActiveBtn('btn-foyer');
      });
      bs.addEventListener('click', function () {
        stopAll();
        clearActiveBtns();
      });
    }

    function setActiveBtn(id) {
      clearActiveBtns();
      var btn = document.getElementById(id);
      if (btn) btn.classList.add('active');
    }

    function clearActiveBtns() {
      var btns = document.querySelectorAll('.btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove('active');
      }
    }

    // ---------------- Φόρτωση JSON ----------------

    function loadDialogs() {
      fetch('dialogs-gr.json')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          dialogsData = data || {};
          prepareViewers();
          prepareBubbles();
          initGraph();
        })
        .catch(function (err) {
          console.error('Σφάλμα φόρτωσης dialogs-gr.json', err);
        });
    }

    // ---------------- Viewers / Avatars ----------------

    function prepareViewers() {
      if (!dialogsData || !dialogsData.viewers) return;
      avatarsContainer.innerHTML = '';
      viewersById = {};

      for (var i = 0; i < dialogsData.viewers.length; i++) {
        var v = dialogsData.viewers[i];
        viewersById[v.id] = v;

        var img = document.createElement('img');
        img.src = v.img;
        img.alt = v.name_gr || ('Θεατής ' + v.id);
        img.className = 'viewer-avatar';
        img.dataset.viewerId = v.id;

        img.addEventListener('load', function () {
          // όταν φορτώσει, το repositionAllAvatars θα το πιάσει
          repositionAllAvatars();
        });

        avatarsContainer.appendChild(img);
      }
    }

    function showAvatars(show) {
      var imgs = document.querySelectorAll('.viewer-avatar');
      for (var i = 0; i < imgs.length; i++) {
        imgs[i].style.display = show ? 'block' : 'none';
      }
      if (show) {
        repositionAllAvatars();
      }
    }

    function markSpeakingViewer(viewerId) {
      var imgs = document.querySelectorAll('.viewer-avatar');
      for (var i = 0; i < imgs.length; i++) {
        var id = parseInt(imgs[i].dataset.viewerId, 10);
        if (id === viewerId) {
          imgs[i].classList.add('speaking');
        } else {
          imgs[i].classList.remove('speaking');
        }
      }
    }

    function clearSpeaking() {
      var imgs = document.querySelectorAll('.viewer-avatar');
      for (var i = 0; i < imgs.length; i++) {
        imgs[i].classList.remove('speaking');
      }
    }

    function repositionAllAvatars() {
      if (!dialogsData || !dialogsData.viewers) return;
      if (!koinoImg) return;

      var rect = koinoImg.getBoundingClientRect();
      if (!rect.width || !rect.height) return;

      var imgs = document.querySelectorAll('.viewer-avatar');
      for (var i = 0; i < imgs.length; i++) {
        var img = imgs[i];
        var vid = parseInt(img.dataset.viewerId, 10);
        var v = viewersById[vid];
        if (!v) continue;

        // βάση: από κάτω μέρος koino
        var baseX = rect.left + rect.width * v.xFrac;
        var baseY = rect.bottom - (v.avatarDy || 0);

        // προσωρινά εμφανές για σωστό bounding box
        var prevDisplay = img.style.display;
        img.style.display = 'block';

        // scale
        var scale = (v.avatarScale || 1);
        img.style.transform = 'scale(' + scale + ')';

        var br = img.getBoundingClientRect();
        var w = br.width || 0;
        var h = br.height || 0;

        img.style.left = (baseX - w / 2) + 'px';
        img.style.top = (baseY - h) + 'px';

        img.style.display = prevDisplay;
      }
    }

    // ---------------- Bubbles ----------------

    function prepareBubbles() {
      bubblesContainer.innerHTML = '';
      if (!dialogsData || !dialogsData.viewers) return;

      for (var i = 0; i < dialogsData.viewers.length; i++) {
        var v = dialogsData.viewers[i];
        var div = document.createElement('div');
        div.className = 'viewer-bubble';
        div.dataset.viewerId = v.id;
        bubblesContainer.appendChild(div);
      }
    }

    function hideAllBubbles() {
      var bs = document.querySelectorAll('.viewer-bubble');
      for (var i = 0; i < bs.length; i++) {
        bs[i].style.display = 'none';
      }
    }

    function showBubbleForEvent(ev) {
      if (!ev || !ev.viewer) return;

      var bubble = getBubbleForViewer(ev.viewer);
      if (!bubble) return;

      // κείμενο για acts: από left
      bubble.innerHTML = ev.left || '';
      bubble.style.display = 'block';

      placeBubble(bubble, ev.viewer, ev.xShift, ev.yOffset);
    }

    function getBubbleForViewer(viewerId) {
      var list = document.querySelectorAll('.viewer-bubble');
      for (var i = 0; i < list.length; i++) {
        var vId = parseInt(list[i].dataset.viewerId, 10);
        if (vId === viewerId) return list[i];
      }
      return null;
    }

    function placeBubble(bubbleEl, viewerId, xShift, yOffset) {
      if (!bubbleEl || !viewerId) return;
      if (!koinoImg) return;

      var v = viewersById[viewerId];
      if (!v) return;

      var rect = koinoImg.getBoundingClientRect();
      if (!rect.width || !rect.height) return;

      var baseX = rect.left + rect.width * v.xFrac;
      var baseY = rect.bottom;

      var dx = (v.bubbleDx || 0) + (xShift || 0);
      var dy = (v.bubbleDy || 0) + (yOffset || 0);

      var x = baseX + dx;
      var y = baseY - dy;

      var prevDisplay = bubbleEl.style.display;
      bubbleEl.style.display = 'block';
      var br = bubbleEl.getBoundingClientRect();
      var bw = br.width || 0;
      var bh = br.height || 0;

      bubbleEl.style.left = (x - bw / 2) + 'px';
      bubbleEl.style.top = (y - bh) + 'px';

      bubbleEl.style.display = prevDisplay;
    }

    function repositionAllBubbles() {
      // απλά ξανατοποθέτηση για όσα είναι visible
      var bs = document.querySelectorAll('.viewer-bubble');
      for (var i = 0; i < bs.length; i++) {
        var b = bs[i];
        if (b.style.display !== 'none') {
          var vid = parseInt(b.dataset.viewerId, 10);
          // δεν ξέρουμε xShift,yOffset του event εδώ -> τα αγνοούμε.
          // Ο βασικός recalc θα γίνεται κυρίως σε νέα γεγονότα.
          placeBubble(b, vid, 0, 0);
        }
      }
    }

    // ---------------- Γραφήματα (uPlot placeholder) ----------------

    function initGraph() {
      var container = document.getElementById('uplot-container');
      if (!container) return;

      var data = [
        [0, 1, 2, 3, 4, 5],
        [0, 1, 0, -1, 0, 1]
      ];
      var opts = {
        width: container.clientWidth || 400,
        height: container.clientHeight || 240,
        series: [
          {},
          {
            label: 'x(t)'
          }
        ]
      };
      uplot = new uPlot(opts, data, container);
    }

    function showGraphKind(kind) {
      // εδώ μπορείς να βάλεις εναλλαγή καμπυλών x, v, a, κ.λπ.
      console.log('showGraphKind:', kind);
    }

    // ---------------- Acts λογική ----------------

    function stopAll() {
      for (var i = 0; i < actTimeouts.length; i++) {
        clearTimeout(actTimeouts[i]);
      }
      actTimeouts = [];
      foyerRunning = false;
      clearSpeaking();
      hideAllBubbles();
      hideFoyerPanel();
      currentAct = null;
      actLabelEl.textContent = '-';
    }

    function playAct(actName) {
      stopAll();
      currentAct = actName;
      actLabelEl.textContent = actName === 'act1' ? 'Πράξη 1' : 'Πράξη 2';

      showFoyerPanel(false);
      showAvatars(false); // στις πράξεις δεν θες εικόνες θεατών
      clearSpeaking();
      hideAllBubbles();

      var list = dialogsData[actName] || [];
      if (!list.length) return;

      if (actName === 'act1') {
        playAct1Timed(list);
      } else {
        playAct2Sequential(list);
      }
    }

    function playAct1Timed(events) {
      var baseMs = 1000;
      for (var i = 0; i < events.length; i++) {
        var ev = events[i];
        if (typeof ev.atT === 'number') {
          (function (evCopy) {
            var delay = evCopy.atT * baseMs;
            var id = setTimeout(function () {
              runEvent(evCopy, 'act1');
            }, delay);
            actTimeouts.push(id);
          })(ev);
        } else {
          // ό,τι δεν έχει atT (π.χ. law χωρίς χρόνο) το αγνοούμε ή το βάζουμε σε καθαρή σειρά
        }
      }
    }

    function playAct2Sequential(events) {
      var delayAccum = 0;
      var stepMs = 3200;

      for (var i = 0; i < events.length; i++) {
        (function (evCopy, d) {
          var id = setTimeout(function () {
            runEvent(evCopy, 'act2');
          }, d);
          actTimeouts.push(id);
        })(events[i], delayAccum);
        delayAccum += stepMs;
      }
    }

    function runEvent(ev, actName) {
      if (!ev || !ev.kind) return;

      if (ev.kind === 'bubble' || ev.kind === 'bubbleDyn') {
        if (ev.viewer) {
          showBubbleForEvent(ev);
        }
        if (ev.kind === 'bubbleDyn' && ev.what) {
          console.log('Dynamic bubble kind:', ev.what);
        }
      } else if (ev.kind === 'law') {
        console.log('Νόμος:', ev.left);
      } else if (ev.kind === 'graph') {
        showGraphKind('x');
      } else if (ev.kind === 'lawPlot') {
        showGraphKind(ev.plot || 'x');
      } else if (ev.kind === 'close') {
        hideAllBubbles();
        clearSpeaking();
      }

      if (actName === 'act2') {
        hideAllBubbles();
        if (ev.kind === 'bubble' || ev.kind === 'bubbleDyn') {
          if (ev.viewer) {
            showBubbleForEvent(ev);
          }
        }
      }
    }

    // ---------------- Foyer λογική ----------------

    function showFoyerPanel(show) {
      foyerPanel.style.display = show ? 'block' : 'none';
    }

    function hideFoyerPanel() {
      foyerPanel.style.display = 'none';
      foyerLeftEl.innerHTML = '';
      foyerRightEl.innerHTML = '';
    }

    function playFoyer() {
      stopAll();
      currentAct = 'foyer';
      actLabelEl.textContent = 'Φουαγιέ';

      var list = dialogsData.foyer || [];
      if (!list.length) return;

      foyerRunning = true;
      foyerIndex = 0;
      showAvatars(true);
      showFoyerPanel(true);
      hideAllBubbles();
      clearSpeaking();

      playNextFoyerLine();
    }

    function playNextFoyerLine() {
      if (!foyerRunning) return;
      var list = dialogsData.foyer || [];
      if (foyerIndex >= list.length) {
        foyerRunning = false;
        clearSpeaking();
        hideAllBubbles();
        return;
      }

      var ev = list[foyerIndex];
      foyerIndex++;

      var viewerId = ev.viewer || null;
      if (viewerId) {
        markSpeakingViewer(viewerId);
        showBubbleForEvent(ev); // bubble πάνω στον ομιλητή, ίδιος μηχανισμός με acts
      } else {
        clearSpeaking();
        hideAllBubbles();
      }

      foyerLeftEl.innerHTML = ev.left || '';
      foyerRightEl.innerHTML = ev.right || '';

      var typeMs = ev.typeMs || 3000;
      var pauseMs = ev.pauseMs || 1000;
      var total = typeMs + pauseMs;

      var id = setTimeout(function () {
        playNextFoyerLine();
      }, total);
      actTimeouts.push(id);
    }
  </script>
</body>
</html>
