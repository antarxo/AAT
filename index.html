<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Θεατρική Σκηνή – Spring + Skater</title>
<style>
  :root{ --curtain-speed:1.2s; }
  body{ margin:0; background:radial-gradient(circle at center,#222 0%,#000 100%); overflow:hidden; font-family:Inter,system-ui,sans-serif; }
  .stage{ position:relative; width:100vw; height:100vh; overflow:hidden; }

  .curtain-top,.curtain-upper,.curtain-lower,.curtain-side{
    position:absolute; z-index:3;
    transition:transform var(--curtain-speed) cubic-bezier(.2,.9,.2,1),opacity 1s;
    will-change:transform,opacity;
  }
  .curtain-top{ top:0; width:100%; height:28%;
    background:linear-gradient(to bottom,#230000,#180000); box-shadow:0 5px 18px rgba(0,0,0,.8); }
  .open .curtain-top{ opacity:.25; }
  .curtain-upper{ top:28%; width:100%; height:40%;
    background:linear-gradient(to bottom,#8b0000,#400000); transform-origin:top; }
  .curtain-lower{ bottom:0; width:100%; height:32%;
    background:linear-gradient(to top,#7a0000,#300000); transform-origin:bottom; }
  .curtain-side{ top:0; width:18%; height:100%;
    background:linear-gradient(to right,#300000,#1a0000); box-shadow:inset -6px 0 10px rgba(0,0,0,.6); }
  .curtain-side.right{ right:0; background:linear-gradient(to left,#300000,#1a0000); box-shadow:inset 6px 0 10px rgba(0,0,0,.6); }
  .open .curtain-upper{ transform:translateY(-100%); }
  .open .curtain-lower{ transform:translateY(100%); }
  .open .curtain-side.left{ transform:translateX(-100%); }
  .open .curtain-side.right{ transform:translateX(100%); }

  .signboard{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    background:transparent; border:none; border-radius:10px; padding:14px 22px;
    color:#ddd; font-family:Georgia,serif; text-align:center; z-index:4; line-height:1.6;
    text-shadow:0 1px 2px rgba(0,0,0,.7);
  }
  .signboard h1{ font-size:32px; margin:0; color:#fff; }
  .signboard h2{ font-size:20px; margin:4px 0 0 0; }
  .signboard h3{ font-size:18px; margin:4px 0 0 0; color:#ffd27a; }

  .viewers{ position:absolute; bottom:0; width:100%; display:flex; justify-content:center; gap:3vw; z-index:1; padding-bottom:12px; }
  .viewer{ width:60px; height:100px;
    background:url('https://upload.wikimedia.org/wikipedia/commons/f/f9/Silhouette_icon.svg') no-repeat center/contain;
    filter:grayscale(1) brightness(.6); opacity:.75; }

  /* --- Spring + Skater --- */
  .mechanics-layer{ position:absolute; inset:0; z-index:2; pointer-events:none; }
  .spring-wrap{
    position:absolute;
    left:8vw;
    bottom:calc(14vh + 30px);   /* +30px πιο πάνω */
    height:110px;
    display:flex; align-items:center;
  }
  .spring-img{
    height:100%;
    transform-origin:left center;   /* αριστερό άκρο σταθερό */
    image-rendering:auto;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.55));
    will-change:transform;
  }
  .skater{
    position:absolute; 
    bottom:calc(14vh + 30px - 4px); /* +30px πιο πάνω (ίδιο επίπεδο με spring) */
    width:160px; height:auto;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.6));
    will-change:transform,left;
    pointer-events:none;
  }

  .start-btn{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:5; background:#700; color:#fff; border:none; border-radius:8px;
    padding:12px 24px; font-size:18px; cursor:pointer; box-shadow:0 0 10px #300;
  }
  .start-btn:active{ transform:translate(-50%,-50%) scale(.98); }
</style>
</head>
<body>
  <div class="stage" id="stage" aria-label="Θεατρική σκηνή">
    <div class="curtain-top"></div>
    <div class="curtain-upper"></div>
    <div class="curtain-lower"></div>
    <div class="curtain-side left"></div>
    <div class="curtain-side right"></div>

    <div class="signboard" aria-live="polite">
      <h1>Πράξη 1</h1>
      <h2>m₁ = 70 kg, D₁ = 77 N/m</h2>
      <h3>Εμηχ = 347 J</h3>
    </div>

    <!-- Μηχανική σκηνή -->
    <div class="mechanics-layer">
      <!-- Ελατήριο: αριστερό άκρο σταθερό, αλλάζει μόνο το πλάτος -->
      <div class="spring-wrap" id="springWrap">
        <img id="springImg" class="spring-img" src="spring.png" alt="Ελατήριο"/>
      </div>
      <!-- Skater: δεμένος στο δεξί άκρο του ελατηρίου -->
      <img id="skater" class="skater" src="skater.png" alt="Skater"/>
    </div>

    <div class="viewers" aria-hidden="true">
      <div class="viewer"></div><div class="viewer"></div><div class="viewer"></div><div class="viewer"></div><div class="viewer"></div>
    </div>

    <button class="start-btn" id="startBtn" aria-label="Έναρξη παράστασης">Έναρξη</button>
  </div>

<script>
  // --- Φυσική ---
  const m   = 70;     // kg
  const T   = 6.0;    // s
  const A_m = 3.0;    // m
  const omega = 2*Math.PI / T;
  const D = Math.round(m * omega * omega);   // N/m
  const E_mech = 0.5 * D * A_m * A_m;        // J

  // --- Κλίμακα & γεωμετρία εικόνων ---
  const pxPerMeter = 50;        // m→px
  const L0_px = 380;            // μήκος ηρεμίας spring.png (px)
  const leftAnchorPx = 0;       // offset μέσα στη spring-wrap
  const skaterAnchorOffset = 80; // «δέσιμο» του skater στο δεξί άκρο

  // --- DOM ---
  const stage = document.getElementById('stage');
  const startBtn = document.getElementById('startBtn');
  const springWrap = document.getElementById('springWrap');
  const springImg = document.getElementById('springImg');
  const skater = document.getElementById('skater');

  // --- Πινακίδα ---
  document.addEventListener('DOMContentLoaded', ()=>{
    document.querySelector('.signboard h2').textContent = `m₁ = ${m} kg, D₁ = ${D} N/m`;
    document.querySelector('.signboard h3').textContent = `Εμηχ = ${Math.round(E_mech)} J`;
  });

  // --- Υπολογισμοί πλάτους/θέσης ---
  let A_px = 0;
  function recalc(){
    const maxSwing = stage.clientWidth * 0.38;
    A_px = Math.min(pxPerMeter * A_m, maxSwing);
  }
  window.addEventListener('resize', recalc);
  recalc();

  // --- ΑΑΤ ---
  let t0 = performance.now();
  function frame(now){
    const t = (now - t0)/1000;
    const x = A_px * Math.sin(omega * t);     // οριζόντια απομάκρυνση δεξιού άκρου
    const L_px = Math.max(40, L0_px + x);     // νέο μήκος ελατηρίου

    const scaleX = L_px / L0_px;              // τέντωμα/συσπείρωση με αριστερό άκρο σταθερό
    springImg.style.transform = `translateX(${leftAnchorPx}px) scaleX(${scaleX})`;

    skater.style.left = `calc(8vw + ${L_px - skaterAnchorOffset}px)`; // 8vw = left της spring-wrap

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // --- Κουρτίνες ---
  startBtn.addEventListener('click', ()=>{
    stage.classList.add('open');
    startBtn.style.display = 'none';
  });
</script>
</body>
</html>
