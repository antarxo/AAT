<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Θεατρική Σκηνή — Ενιαία Έκδοση (Act I + Act II + Φουαγιέ)</title>

<link rel="stylesheet" href="aat-stage.css">
<link rel="stylesheet" href="https://unpkg.com/uplot@1.6.30/dist/uPlot.min.css">
<script src="https://unpkg.com/uplot@1.6.30/dist/uPlot.iife.min.js"></script>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at center,#222 0%,#000 100%);
  overflow: hidden;
  font-family: Inter, system-ui, sans-serif;
}
.stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}
button {
  border: none;
  border-radius: 8px;
  background: #e33;
  color: #fff;
  font-size: 1rem;
  padding: 0.6em 1em;
  cursor: pointer;
  transition: background 0.3s;
}
button:hover {
  background: #c00;
}
#countdownOverlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: none;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 4rem;
  z-index: 1000;
}
#xtChart {
  position: absolute;
  bottom: 10px;
  right: 10px;
  width: 300px;
  height: 180px;
  background: #111;
  border: 1px solid #444;
  border-radius: 6px;
  display: none;
}
#paramsBox {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 0.9rem;
  display: none;
}
</style>
</head>

<body>
<div class="stage" id="stage">
  <button id="startBtn" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
    Έναρξη
  </button>

  <div id="countdownOverlay"><div id="countdownTimer">5</div></div>

  <div id="xtChart"></div>
  <div id="paramsBox">
    <div id="paramA"></div>
    <div id="paramW"></div>
    <div id="paramPhi"></div>
  </div>
</div>

<script>
// =================== ΠΑΓΚΟΣΜΙΕΣ ΜΕΤΑΒΛΗΤΕΣ ===================
let uXT = null;
let A_m = 2.0;         // πλάτος ταλάντωσης (τυπικό)
let T = 6.28;          // περίοδος
let omega = 2*Math.PI / T;
let LANG = 'gr';
let xtChart = null;
let startBtn = null;
let countdownOverlay = null;
let countdownTimerEl = null;
let paramsBoxEl = null;
let paramAEl, paramWEl, paramPhiEl;

// =================== ΒΟΗΘΗΤΙΚΕΣ ΣΥΝΑΡΤΗΣΕΙΣ ===================
function x0Val() { return 0.5 * A_m; }

function buildSeriesData() {
  const N = 200;
  const dt = T / (N-1);
  const tArr = [];
  const xArr = [];
  for (let i=0;i<N;i++) {
    const t = i * dt;
    const x = A_m * Math.sin(omega*t);
    tArr.push(t);
    xArr.push(x);
  }
  return [tArr,xArr];
}

// =================== ΦΟΡΤΩΜΑ ΔΙΑΛΟΓΩΝ ===================
async function loadDialogs(lang='gr') {
  const res = await fetch('dialogs-' + lang + '.json');
  if(!res.ok) throw new Error('Αποτυχία φόρτωσης διαλόγων');
  const data = await res.json();
  console.log('Διάλογοι φορτώθηκαν:', data.length);
}

// =================== uPlot ΔΙΑΓΡΑΜΜΑ ===================
function initXTChart(){
  if(uXT) return;
  xtChart.style.display='block';

  const w = Math.floor(
    xtChart.clientWidth || Math.max(160, (stage.clientWidth*0.18) - 16)
  );
  const h = Math.floor(
    xtChart.clientHeight || Math.max(120, stage.clientHeight*0.35)
  );

  const xData = buildSeriesData();
  const tArr  = xData[0];
  const xArr  = xData[1];

  const opts = {
    width:  w,
    height: h,
    scales: {
      x: { time:false, range:[0, T] },
      y: { range:[-A_m*1.1, A_m*1.1] }
    },
    axes: [
      {
        label: 't (s)',
        values: (u, vals)=>vals.map(v=>v.toFixed(1))
      },
      {
        label: 'x (m)'
      }
    ],
    series: [
      {},            // άξονας χρόνου
      { label: 'x(t)' }
    ]
  };

  uXT = new uPlot(opts, [tArr, xArr], xtChart);
}

function drawXTChart(){
  if(!uXT) return;
  const xData = buildSeriesData();
  uXT.setData(xData);
}

// =================== ΠΑΡΑΜΕΤΡΟΙ ===================
function showCurtainParams(){
  paramsBoxEl.style.display='block';

  const A    = A_m.toFixed(1);
  const Tval = T.toFixed(1);
  const om   = omega.toFixed(2);
  const x0v  = x0Val();
  const x0   = x0v.toFixed(2);

  let phiDeg = 0;
  if(Math.abs(A_m) > 1e-6){
    const ratio = Math.max(-1, Math.min(1, x0v / A_m));
    phiDeg = (Math.asin(ratio) * 180/Math.PI).toFixed(1);
  }

  paramAEl.textContent  = `A = ${A} m`;
  paramWEl.textContent  = `T = ${Tval} s, ω = ${om} rad/s`;
  paramPhiEl.textContent  = `x₀ = ${x0} m, φ₀ = ${phiDeg}°`;
}

// =================== ΚΥΡΙΟ SCRIPT ===================
document.addEventListener('DOMContentLoaded', async ()=>{
  stage = document.getElementById('stage');
  xtChart = document.getElementById('xtChart');
  startBtn = document.getElementById('startBtn');
  countdownOverlay = document.getElementById('countdownOverlay');
  countdownTimerEl = document.getElementById('countdownTimer');
  paramsBoxEl = document.getElementById('paramsBox');
  paramAEl = document.getElementById('paramA');
  paramWEl = document.getElementById('paramW');
  paramPhiEl = document.getElementById('paramPhi');

  try {
    await loadDialogs(LANG);
  } catch(e) {
    console.warn(e);
  }

  showCurtainParams();
  initXTChart();

  if(startBtn){
    startBtn.addEventListener('click', ()=>{
      startBtn.style.display='none';
      if(!countdownOverlay || !countdownTimerEl) return;

      countdownOverlay.style.display='flex';
      let t = 5;
      countdownTimerEl.textContent = t;

      const iv = setInterval(()=>{
        t--;
        countdownTimerEl.textContent = t;
        if(t <= 0){
          clearInterval(iv);
          countdownOverlay.style.display='none';
          drawXTChart();
          console.log('Έναρξη Πράξης Ι — AAT ενεργό');
        }
      }, 1000);
    });
  }
});
</script>
</body>
</html>
