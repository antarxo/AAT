<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AAT — Scaled Shell (1600×900)</title>
  <style>
    html,body{height:100%;margin:0;background:#0b0f14;overflow:hidden;}
    /* Κεντράρουμε και κλιμακώνουμε ΟΛΟ το app χωρίς να πειράξουμε τίποτα μέσα του */
    #wrap{
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
    }
    #frame{
      width:1600px; height:900px;
      border:0;
      transform-origin:center center;
      /* keep text crisp-ish */
      image-rendering:auto;
      background:transparent;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <iframe id="frame" src="./index.html" scrolling="no"></iframe>
  </div>

  <script>
  (function(){
    const BASE_W = 1600, BASE_H = 900;
    const frame = document.getElementById('frame');

    function fit(){
      const vw = window.innerWidth || document.documentElement.clientWidth || BASE_W;
      const vh = window.innerHeight || document.documentElement.clientHeight || BASE_H;
      const s = Math.min(vw/BASE_W, vh/BASE_H);
      frame.style.transform = `scale(${s})`;
    }

    window.addEventListener('resize', fit, {passive:true});
    window.addEventListener('orientationchange', fit);
    window.addEventListener('load', fit);
    fit();
  })();
  </script>
</body>
</html>
