<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Θεατρική Σκηνή – Mockup</title>
<style>
  body {
    margin: 0;
    background: radial-gradient(circle at center, #222 0%, #000 100%);
    overflow: hidden;
    font-family: Inter, system-ui, sans-serif;
  }
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  .curtain-top, .curtain-upper, .curtain-lower, .curtain-side {
    position: absolute;
    z-index: 3;
    transition: transform 1.2s cubic-bezier(.2,.9,.2,1), opacity 1s;
  }
  .curtain-top {
    top: 0;
    width: 100%;
    height: 28%;
    background: linear-gradient(to bottom, #230000, #180000);
    box-shadow: 0 5px 18px rgba(0,0,0,0.8);
  }
  .curtain-upper {
    top: 28%;
    width: 100%;
    height: 40%;
    background: linear-gradient(to bottom, #8b0000, #400000);
    transform-origin: top;
  }
  .curtain-lower {
    bottom: 0;
    width: 100%;
    height: 32%;
    background: linear-gradient(to top, #7a0000, #300000);
    transform-origin: bottom;
  }
  .curtain-side {
    top: 0;
    width: 18%;
    height: 100%;
    background: linear-gradient(to right, #300000, #1a0000);
    box-shadow: inset -6px 0 10px rgba(0,0,0,0.6);
  }
  .curtain-side.right {
    right: 0;
    background: linear-gradient(to left, #300000, #1a0000);
    box-shadow: inset 6px 0 10px rgba(0,0,0,0.6);
  }

  .actor {
    position: absolute;
    bottom: 5%;
    left: 50%;
    width: 240px;
    height: 160px;
    transform: translate(-50%, 0);
    z-index: 2;
    pointer-events: none;
  }
  .actor img {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
  }

  .viewers {
    position: absolute;
    bottom: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 3vw;
    z-index: 1;
    padding-bottom: 12px;
  }
  .viewer {
    width: 60px;
    height: 100px;
    background: url('https://upload.wikimedia.org/wikipedia/commons/f/f9/Silhouette_icon.svg') no-repeat center/contain;
    filter: grayscale(1) brightness(0.6);
    opacity: 0.75;
  }

  .signboard {
    position: absolute;
    top: -6px; /* ανέβηκε 20px πιο ψηλά */
    left: 50%;
    transform: translateX(-50%);
    background: transparent; /* πλήρως διαφανές φόντο */
    border: none;
    border-radius: 10px;
    padding: 14px 22px;
    color: #ddd;
    font-family: 'Georgia', serif;
    text-align: center;
    z-index: 4;
    line-height: 1.6;
  }
  .signboard h1 {
    font-size: 32px;
    margin: 0;
    color: #fff;
  }
  .signboard h2 {
    font-size: 20px;
    margin: 4px 0 0 0;
  }
  .signboard h3 {
    font-size: 18px;
    margin: 4px 0 0 0;
    color: #ffd27a;
  }

  .open .curtain-upper { transform: translateY(-100%); }
  .open .curtain-lower { transform: translateY(100%); }

  .start-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    background: #700;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 0 10px #300;
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="curtain-top"></div>
    <div class="curtain-upper"></div>
    <div class="curtain-lower"></div>
    <div class="curtain-side left"></div>
    <div class="curtain-side right"></div>

    <div class="signboard">
      <h1>Πράξη 1</h1>
      <h2>m₁ = 70 kg, D₁ = 77 N/m</h2>
      <h3>Εμηχ = 347 J</h3>
    </div>

    <div class="actor" id="actor">
      <img src="clipart.png" alt="roller με ελατήριο">
    </div>

    <div class="viewers">
      <div class="viewer" data-idx="0"></div>
      <div class="viewer" data-idx="1"></div>
      <div class="viewer" data-idx="2"></div>
      <div class="viewer" data-idx="3"></div>
      <div class="viewer" data-idx="4"></div>
    </div>

    <button class="start-btn" id="startBtn">Έναρξη</button>
  </div>

  <script>
    const m = 70;
    const T = 6.0;
    const A_m = 3.0;
    const omega = 2*Math.PI / T;
    const D = Math.round(m * omega * omega);
    const E_mech = 0.5 * D * A_m * A_m;

    const pxPerMeter = 50;
    let A_px = pxPerMeter * A_m;

    document.addEventListener('DOMContentLoaded', ()=>{
      const h2 = document.querySelector('.signboard h2');
      const h3 = document.querySelector('.signboard h3');
      h2.textContent = `m₁ = ${m} kg, D₁ = ${D} N/m`;
      h3.textContent = `Εμηχ = ${Math.round(E_mech)} J`;
    });

    let t0 = performance.now();
    const actor = document.getElementById('actor');
    const stage = document.getElementById('stage');
    const startBtn = document.getElementById('startBtn');

    let lastFrame = performance.now();
    function animate(now){
      const dt = (now - lastFrame)/1000; lastFrame = now;
      const t = (now - t0)/1000;
      const x = A_px * Math.sin(omega*t + 0.3);
      actor.style.left = `calc(50% + ${x}px)`;
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    startBtn.addEventListener('click', ()=>{
      stage.classList.add('open');
      startBtn.style.display = 'none';
    });
  </script>
</body>
</html>
