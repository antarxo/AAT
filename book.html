<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Βιβλίο Παράστασης – Α.Α.Τ.</title>
  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }
    body{
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:#f4f4f8;
      color:#222;
      line-height:1.4;
      padding:16px;
    }
    .book-root{
      max-width:1100px;
      margin:0 auto 48px auto;
      background:#ffffff;
      border-radius:12px;
      box-shadow:0 8px 24px rgba(0,0,0,0.08);
      padding:20px 22px 28px;
    }
    h1{
      font-size:1.6rem;
      margin-bottom:8px;
    }
    .subtitle{
      font-size:0.9rem;
      color:#555;
      margin-bottom:14px;
    }
    .params-summary{
      background:#f0f3ff;
      border-left:4px solid #4b6fff;
      padding:10px 12px;
      border-radius:8px;
      font-size:0.9rem;
      margin-bottom:18px;
    }
    .params-summary strong{
      font-weight:600;
    }
    .warning{
      background:#fff4e5;
      border-left:4px solid #ff9800;
      padding:8px 10px;
      border-radius:8px;
      font-size:0.85rem;
      margin-bottom:10px;
      color:#7a4b00;
    }
    .book-section{
      border-top:1px solid #ddd;
      margin-top:18px;
      padding-top:16px;
    }
    .book-section:first-of-type{
      border-top:none;
      margin-top:0;
      padding-top:0;
    }
    .book-section h2{
      font-size:1.2rem;
      margin-bottom:10px;
    }
    .book-page{
      display:flex;
      gap:12px;
      align-items:flex-start;
    }
    .book-col{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .book-col-left{
      flex:3;
      min-width:0;
    }
    .book-col-right{
      flex:2;
      min-width:0;
    }
    .card{
      background:#f8f9ff;
      border-radius:8px;
      padding:8px 10px;
      font-size:0.9rem;
      border:1px solid #e0e3ff;
    }
    .note-block{
      background:#f5f5f5;
      border-color:#ddd;
    }
    .note-block b{
      font-weight:600;
    }
    .dialog-row{
      display:flex;
      gap:8px;
      align-items:flex-start;
      border-radius:8px;
      padding:6px 8px;
      background:#fafafa;
      border:1px solid #e2e2e2;
    }
    .dialog-left{
      flex:3;
      font-size:0.9rem;
    }
    .dialog-right{
      flex:2;
      font-size:0.85rem;
      background:#f2f5ff;
      border-radius:6px;
      padding:4px 6px;
      border-left:3px solid #4b6fff;
      white-space:pre-line;
    }
    .dialog-index{
      font-weight:600;
      color:#777;
      font-size:0.8rem;
      margin-bottom:2px;
    }

    /* Πίνακας δειγμάτων t–x */
    .samples-card-title{
      font-weight:600;
      margin-bottom:4px;
      font-size:0.9rem;
    }
    .samples-table-wrap{
      max-height:220px;
      overflow-y:auto;
      border-radius:8px;
      border:1px solid #e0e0e0;
      background:#fff;
    }
    .samples-table{
      width:100%;
      border-collapse:collapse;
      font-size:0.82rem;
    }
    .samples-table th,
    .samples-table td{
      padding:2px 4px;
      border-bottom:1px solid #eee;
      text-align:right;
      white-space:nowrap;
    }
    .samples-table th:first-child,
    .samples-table td:first-child{
      text-align:center;
    }
    .samples-table thead{
      position:sticky;
      top:0;
      background:#f5f7ff;
      z-index:1;
    }

    .block-html{
      font-size:0.9rem;
    }
    .image-block img{
      max-width:100%;
      display:block;
      margin:0 auto 4px auto;
    }
    .image-caption{
      font-size:0.8rem;
      color:#666;
      text-align:center;
    }

    @media (max-width:900px){
      .book-page{
        flex-direction:column;
      }
    }
  </style>
</head>
<body>
<div class="book-root">
  <h1>Βιβλίο Παράστασης – Α.Α.Τ.</h1>
  <div class="subtitle">
    Ανασκόπηση της παράστασης με τις ίδιες τιμές A, T, ω, φ₀, x₀ και τις μετρήσεις t–x από τη σκηνή.
  </div>
  <div id="warnings"></div>
  <div id="paramsBox" class="params-summary" style="display:none;"></div>

  <div id="sectionsContainer"></div>
</div>

<script>
(function(){
  function getLangFromQuery(){
    const qs=new URLSearchParams(window.location.search);
    const lang=(qs.get('lang')||'gr').toLowerCase();
    return (lang==='en')?'en':'gr';
  }
  const lang=getLangFromQuery();

  const warningsEl=document.getElementById('warnings');
  const paramsBox=document.getElementById('paramsBox');
  const sectionsContainer=document.getElementById('sectionsContainer');

  function addWarning(msg){
    const div=document.createElement('div');
    div.className='warning';
    div.textContent=msg;
    warningsEl.appendChild(div);
  }

  function loadBookDataFromStorage(){
    try{
      const raw=localStorage.getItem('aatBookData');
      if(!raw){
        addWarning(lang==='en'
          ? 'No live data found from the performance. Default values will be used.'
          : 'Δεν βρέθηκαν ζωντανά δεδομένα από την παράσταση (aatBookData). Θα χρησιμοποιηθούν προεπιλεγμένες τιμές.');
        return null;
      }
      const obj=JSON.parse(raw);
      if(!obj || typeof obj!=='object'){
        addWarning('Σφάλμα στην ανάγνωση aatBookData.');
        return null;
      }
      return obj;
    }catch(e){
      console.error(e);
      addWarning('Σφάλμα στην ανάγνωση των αποθηκευμένων δεδομένων (localStorage).');
      return null;
    }
  }

  function showParams(bookData){
    if(!bookData){
      paramsBox.style.display='none';
      return;
    }
    const A   = (bookData.A   != null)? Number(bookData.A)   : 3.0;
    const T   = (bookData.T   != null)? Number(bookData.T)   : 6.0;
    const om  = (bookData.omega!=null)? Number(bookData.omega): (2*Math.PI/6.0);
    const phi = (bookData.phi0deg!=null)? Number(bookData.phi0deg):0;
    const x0  = (bookData.x0  != null)? Number(bookData.x0)  : (A*Math.sin(phi*Math.PI/180));

    const lines=[];
    if(lang==='en'){
      lines.push('Amplitude A = '+A.toFixed(2)+' m');
      lines.push('Period T = '+T.toFixed(2)+' s');
      lines.push('Angular frequency ω = '+om.toFixed(3)+' rad/s');
      lines.push('Initial phase φ₀ = '+phi.toFixed(1)+'°');
      lines.push('Initial position x₀ = '+x0.toFixed(2)+' m');
    }else{
      lines.push('Πλάτος A = '+A.toFixed(2)+' m');
      lines.push('Περίοδος T = '+T.toFixed(2)+' s');
      lines.push('Γωνιακή συχνότητα ω = '+om.toFixed(3)+' rad/s');
      lines.push('Αρχική φάση φ₀ = '+phi.toFixed(1)+'°');
      lines.push('Αρχική θέση x₀ = '+x0.toFixed(2)+' m');
    }

    paramsBox.innerHTML='<strong>'+(lang==='en'?'Live parameters:':'Ζωντανές παράμετροι:')+
      '</strong> '+lines.join(' · ');
    paramsBox.style.display='block';
  }

  function renderSamplesTable(container, bookData){
    const wrap=document.createElement('div');
    wrap.className='samples-table-wrap';

    const table=document.createElement('table');
    table.className='samples-table';

    const thead=document.createElement('thead');
    const trh=document.createElement('tr');
    const thIdx=document.createElement('th');
    const thT=document.createElement('th');
    const thX=document.createElement('th');
    thIdx.textContent = '#';
    thT.textContent   = 't (s)';
    thX.textContent   = 'x (m)';
    trh.appendChild(thIdx);
    trh.appendChild(thT);
    trh.appendChild(thX);
    thead.appendChild(trh);
    table.appendChild(thead);

    const tbody=document.createElement('tbody');
    table.appendChild(tbody);

    let samples=(bookData && Array.isArray(bookData.samples))? bookData.samples.slice(): [];

    if(!samples.length){
      const tr=document.createElement('tr');
      const td=document.createElement('td');
      td.colSpan=3;
      td.style.textAlign='center';
      td.textContent=(lang==='en'
        ? 'No measurements were saved.'
        : 'Δεν αποθηκεύτηκαν μετρήσεις.');
      tr.appendChild(td);
      tbody.appendChild(tr);
      wrap.appendChild(table);
      container.appendChild(wrap);
      return;
    }

    samples=samples
      .filter(s=>typeof s.t==='number' && typeof s.x==='number' && s.t>=0)
      .sort((a,b)=>a.t-b.t);

    const T = (bookData && typeof bookData.T==='number')? bookData.T : 6.0;
    const maxT = 2*T;
    samples=samples.filter(s=>s.t<=maxT);

    samples.forEach((s,idx)=>{
      const tr=document.createElement('tr');
      const tdIdx=document.createElement('td');
      const tdT=document.createElement('td');
      const tdX=document.createElement('td');
      tdIdx.textContent=String(idx+1);
      tdT.textContent=s.t.toFixed(2);
      tdX.textContent=s.x.toFixed(2);
      tr.appendChild(tdIdx);
      tr.appendChild(tdT);
      tr.appendChild(tdX);
      tbody.appendChild(tr);
    });

    wrap.appendChild(table);
    container.appendChild(wrap);
  }

  function chooseColumn(block,leftCol,rightCol){
    if(!block) return leftCol;
    if(block.side==='right') return rightCol;
    if(block.side==='left')  return leftCol;
    return leftCol;
  }

  function renderDialogsBlock(block, dialogsBySource, leftCol){
    const arr = dialogsBySource[block.source] || [];
    if(!arr.length) return;

    let from=0;
    let to=arr.length-1;
    if(typeof block.from==='number' && block.from>=0) from=block.from;
    if(typeof block.to==='number' && block.to>=0)   to=Math.min(block.to,arr.length-1);

    for(let i=from;i<=to;i++){
      const ev=arr[i];
      if(!ev) continue;

      const hasLeft = (ev.left && String(ev.left).trim().length>0);
      const hasRight= (ev.right&& String(ev.right).trim().length>0);

      if(!hasLeft && !hasRight) continue;

      const row=document.createElement('div');
      row.className='dialog-row';

      const left=document.createElement('div');
      left.className='dialog-left';
      const idxSpan=document.createElement('div');
      idxSpan.className='dialog-index';
      idxSpan.textContent='#'+(i+1);
      left.appendChild(idxSpan);

      if(hasLeft){
        const p=document.createElement('div');
        p.innerHTML=String(ev.left).replaceAll('\n','<br>');
        left.appendChild(p);
      }
      row.appendChild(left);

      if(hasRight){
        const right=document.createElement('div');
        right.className='dialog-right';
        right.textContent=String(ev.right);
        row.appendChild(right);
      }

      leftCol.appendChild(row);
    }
  }

  function renderSection(sectionDef, dialogsBySource, bookData){
    const sec=document.createElement('div');
    sec.className='book-section';
    sec.dataset.id=sectionDef.id || '';

    const h2=document.createElement('h2');
    if(sectionDef.id==='act1'){
      h2.textContent=(lang==='en'?'Act I – Kinematics':'Πράξη 1η – Κινηματική');
    }else if(sectionDef.id==='act2'){
      h2.textContent=(lang==='en'?'Act II – Dynamics':'Πράξη 2η – Δυναμική περιγραφή');
    }else if(sectionDef.id==='foyer'){
      h2.textContent=(lang==='en'?'Foyer – Summary':'Φουαγιέ – Ανασκόπηση');
    }else{
      h2.textContent=sectionDef.id || 'Ενότητα';
    }
    sec.appendChild(h2);

    const page=document.createElement('div');
    page.className='book-page';

    const leftCol=document.createElement('div');
    leftCol.className='book-col book-col-left';
    const rightCol=document.createElement('div');
    rightCol.className='book-col book-col-right';

    // Ειδικά για Πράξη 1: βασικός πίνακας t–x δεξιά, πριν τους διαλόγους
    if(sectionDef.id==='act1'){
      const card=document.createElement('div');
      card.className='card';
      const title=document.createElement('div');
      title.className='samples-card-title';
      title.textContent = (lang==='en'
        ? 'Measurement table t–x (up to two periods)'
        : 'Πίνακας μετρήσεων t–x (μέχρι δύο περιόδους)');
      card.appendChild(title);
      renderSamplesTable(card, bookData || {});
      rightCol.appendChild(card);
    }

    const blocks = Array.isArray(sectionDef.blocks)? sectionDef.blocks : [];
    blocks.forEach(block=>{
      if(block.type==='note'){
        const col=chooseColumn(block,leftCol,rightCol);
        const div=document.createElement('div');
        div.className='card note-block';
        div.innerHTML=block.html || '';
        col.appendChild(div);
      }
      else if(block.type==='dialogs'){
        renderDialogsBlock(block, dialogsBySource, leftCol);
      }
      else if(block.type==='html'){
        const col=chooseColumn(block,leftCol,rightCol);
        const div=document.createElement('div');
        div.className='card block-html';
        div.innerHTML=block.html || '';
        col.appendChild(div);
      }
      else if(block.type==='image'){
        const col=chooseColumn(block,leftCol,rightCol);
        const wrap=document.createElement('div');
        wrap.className='card image-block';
        if(block.src){
          const img=document.createElement('img');
          img.src=block.src;
          img.alt=block.alt || '';
          wrap.appendChild(img);
        }
        if(block.caption){
          const cap=document.createElement('div');
          cap.className='image-caption';
          cap.textContent=block.caption;
          wrap.appendChild(cap);
        }
        col.appendChild(wrap);
      }
      else if(block.type==='table' && block.source==='samples'){
        const col=chooseColumn(block,leftCol,rightCol);
        const card=document.createElement('div');
        card.className='card';
        const title=document.createElement('div');
        title.className='samples-card-title';
        title.textContent = block.title || (lang==='en'
          ? 'Measurement table t–x'
          : 'Πίνακας μετρήσεων t–x');
        card.appendChild(title);
        renderSamplesTable(card, bookData || {});
        col.appendChild(card);
      }
    });

    page.appendChild(leftCol);
    page.appendChild(rightCol);
    sec.appendChild(page);
    return sec;
  }

  async function init(){
    const bookData = loadBookDataFromStorage();
    if(bookData) showParams(bookData);

    const dialogsUrl = (lang==='en')? 'dialogs-en.json' : 'dialogs-gr.json';
    const bookJsonUrl = 'book-gr.json';

    try{
      const [respDialogs, respBook] = await Promise.all([
        fetch(dialogsUrl,{cache:'no-store'}),
        fetch(bookJsonUrl,{cache:'no-store'})
      ]);

      if(!respDialogs.ok){
        addWarning('Δεν βρέθηκε '+dialogsUrl);
        return;
      }
      const dialogsObj = await respDialogs.json();
      const dialogsBySource = {
        act1: dialogsObj.act1 || [],
        act2: dialogsObj.act2 || [],
        foyer: dialogsObj.foyer || []
      };

      let bookDef={sections:[]};
      if(respBook.ok){
        bookDef = await respBook.json();
      }else{
        addWarning('Δεν βρέθηκε book-gr.json – χρησιμοποιείται κενός ορισμός.');
      }

      const sections = Array.isArray(bookDef.sections)? bookDef.sections : [];

      sections.forEach(secDef=>{
        const secEl = renderSection(secDef, dialogsBySource, bookData);
        sectionsContainer.appendChild(secEl);
      });

      if(!sections.length){
        addWarning('Το book-gr.json δεν περιέχει sections.');
      }
    }catch(e){
      console.error(e);
      addWarning('Σφάλμα κατά τη φόρτωση των δεδομένων βιβλίου.');
    }
  }

  init();
})();
</script>
</body>
</html>
