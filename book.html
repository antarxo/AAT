<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>📖 Βιβλίο Παράστασης Α.Α.Τ.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{
      margin:0;
      font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:#111;
      color:#f5f5f5;
    }
    .book-shell{
      max-width:1200px;
      margin:0 auto;
      padding:24px 16px 40px;
      display:grid;
      grid-template-columns: minmax(0,2fr) minmax(260px,1fr);
      gap:24px;
    }
    h1{
      margin:0 0 12px;
      font-size:1.6rem;
    }
    h2{
      margin:24px 0 8px;
      font-size:1.2rem;
      border-bottom:1px solid rgba(255,255,255,0.1);
      padding-bottom:4px;
    }
    h3{
      margin:16px 0 6px;
      font-size:1.05rem;
    }
    .param-box{
      background:radial-gradient(circle at top,#333 0%,#181818 55%,#050505 100%);
      border-radius:12px;
      padding:12px 14px;
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:0 0 18px rgba(0,0,0,0.45);
      margin-bottom:16px;
      font-size:0.9rem;
    }
    .param-box .row{
      display:flex;
      justify-content:space-between;
      gap:8px;
      margin:2px 0;
    }
    .param-label{
      opacity:0.78;
    }
    .param-value{
      font-weight:500;
    }
    .tx-table-wrap{
      background:#121212;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.08);
      padding:10px 10px 6px;
      box-shadow:0 0 12px rgba(0,0,0,0.4);
      font-size:0.85rem;
    }
    table.tx{
      width:100%;
      border-collapse:collapse;
      font-variant-numeric:tabular-nums;
    }
    table.tx th,
    table.tx td{
      padding:4px 6px;
      text-align:right;
      border-bottom:1px solid rgba(255,255,255,0.06);
    }
    table.tx th:first-child,
    table.tx td:first-child{
      text-align:center;
      width:48px;
    }
    table.tx thead th{
      font-weight:600;
      opacity:0.86;
    }
    tr.tx-x0-row td{
      background:rgba(255,255,200,0.04);
      border-bottom-color:rgba(255,255,180,0.25);
    }
    tr.tx-x0-row td:last-child::after{
      content:"  (x₀)";
      opacity:0.85;
      font-size:0.8em;
    }
    .aside{
      font-size:0.9rem;
    }
    .notice{
      font-size:0.9rem;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.15);
      background:rgba(20,20,20,0.9);
      margin-bottom:14px;
    }
    .section{
      margin-bottom:26px;
    }
    .note-block{
      background:rgba(255,255,255,0.03);
      border-radius:10px;
      padding:10px 12px;
      border:1px solid rgba(255,255,255,0.06);
      margin-bottom:10px;
      font-size:0.9rem;
    }
    .dialogs-table{
      width:100%;
      border-collapse:collapse;
      font-size:0.9rem;
    }
    .dialogs-table td{
      vertical-align:top;
      padding:6px 8px;
      border-bottom:1px solid rgba(255,255,255,0.06);
    }
    .dialogs-table td.left{
      width:60%;
    }
    .dialogs-table td.right{
      width:40%;
      font-family:"Consolas","Fira Code",monospace;
      font-size:0.85rem;
      white-space:pre-line;
    }
    .dim{
      opacity:0.75;
      font-size:0.85em;
    }
    .tag{
      display:inline-block;
      padding:2px 6px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.25);
      font-size:0.75rem;
      text-transform:uppercase;
      letter-spacing:0.06em;
      opacity:0.9;
      margin-left:4px;
    }
    a{
      color:#9fd4ff;
      text-decoration:none;
    }
    a:hover{
      text-decoration:underline;
    }
    @media (max-width:900px){
      .book-shell{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
<div class="book-shell">
  <main>
    <h1>📖 Βιβλίο Παράστασης Α.Α.Τ.</h1>
    <div id="paramBoxHost"></div>
    <section class="section" id="section-act1"></section>
    <section class="section" id="section-act2"></section>
    <section class="section" id="section-foyer"></section>
  </main>
  <aside class="aside">
    <div class="notice" id="dataNotice">Τα δεδομένα της παράστασης φορτώνονται...</div>
    <div id="txTableHost"></div>
  </aside>
</div>

<script>
(function(){
  function getLang(){
    const params = new URLSearchParams(location.search);
    const lang = params.get('lang');
    return (lang === 'en') ? 'en' : 'gr';
  }

  const lang = getLang();

  async function loadJSON(url){
    const resp = await fetch(url, {cache:'no-store'});
    if(!resp.ok) throw new Error('HTTP '+resp.status+' for '+url);
    return resp.json();
  }

  function safeGetBookData(){
    try{
      const raw = localStorage.getItem('aatBookData');
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){
      console.error('aatBookData parse error', e);
      return null;
    }
  }

  function renderParams(host, data){
    if(!data){
      host.innerHTML = '';
      return;
    }
    const A    = data.A;
    const T    = data.T;
    const omega= data.omega;
    const x0   = data.x0;
    const phi0 = data.phi0; // deg

    const div = document.createElement('div');
    div.className='param-box';
    div.innerHTML = `
      <div class="row">
        <div class="param-label">A</div>
        <div class="param-value">= ${A.toFixed(2)} m</div>
      </div>
      <div class="row">
        <div class="param-label">T</div>
        <div class="param-value">= ${T.toFixed(2)} s</div>
      </div>
      <div class="row">
        <div class="param-label">ω</div>
        <div class="param-value">= ${omega.toFixed(3)} rad/s</div>
      </div>
      <div class="row">
        <div class="param-label">φ₀</div>
        <div class="param-value">≈ ${phi0.toFixed(1)}°</div>
      </div>
      <div class="row">
        <div class="param-label">x₀</div>
        <div class="param-value">≈ ${x0.toFixed(2)} m</div>
      </div>
    `;
    host.innerHTML='';
    host.appendChild(div);
  }

  function renderTxTable(host, data){
    host.innerHTML='';
    if(!data || !Array.isArray(data.samples) || data.samples.length === 0){
      const div = document.createElement('div');
      div.className='tx-table-wrap';
      div.textContent = (lang==='en')
        ? 'No measurements were exported from the performance yet.'
        : 'Δεν έχουν εξαχθεί ακόμη μετρήσεις από την παράσταση.';
      host.appendChild(div);
      return;
    }

    // ταξινόμηση ανά idx (όπως στη σκηνή)
    const samples = [...data.samples].sort((a,b)=>(a.idx||0)-(b.idx||0));

    const wrap = document.createElement('div');
    wrap.className='tx-table-wrap';

    const title = document.createElement('div');
    title.style.marginBottom='4px';
    title.style.display='flex';
    title.style.justifyContent='space-between';
    title.style.alignItems='baseline';
    title.innerHTML = `
      <span>${lang==='en' ? 'Sample table t–x' : 'Πίνακας μετρήσεων t–x'}</span>
      <span class="dim">${lang==='en' ? 'from live performance' : 'από τη ζωντανή παράσταση'}</span>
    `;
    wrap.appendChild(title);

    const table = document.createElement('table');
    table.className='tx';

    table.innerHTML = `
      <thead>
        <tr>
          <th>#</th>
          <th>t (s)</th>
          <th>x (m)</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;

    const tbody = table.querySelector('tbody');

    samples.forEach(s => {
      const tr = document.createElement('tr');
      const t = Number(s.t)||0;
      const x = Number(s.x)||0;
      const idx = s.idx||0;

      const isX0 = Math.abs(t) < 1e-6; // t ≈ 0 ⇒ x₀
      if(isX0) tr.classList.add('tx-x0-row');

      tr.innerHTML = `
        <td>${idx}</td>
        <td>${t.toFixed(2)}</td>
        <td>${x.toFixed(2)}</td>
      `;
      tbody.appendChild(tr);
    });

    wrap.appendChild(table);
    host.appendChild(wrap);
  }

  function sliceDialogs(arr, from, to){
    if(!Array.isArray(arr)) return [];
    const start = Math.max(0, from|0);
    let end;
    if(typeof to === 'number' && to >= 0){
      end = Math.min(arr.length, to+1);
    }else{
      end = arr.length;
    }
    return arr.slice(start,end);
  }

  function renderSection(container, sectionDef, dialogs){
    if(!sectionDef) return;
    container.innerHTML='';

    let title;
    if(sectionDef.id === 'act1'){
      title = (lang==='en'?'Act I: Kinematics':'Πράξη 1: Κινηματική');
    }else if(sectionDef.id === 'act2'){
      title = (lang==='en'?'Act II: Dynamics':'Πράξη 2: Δυναμική');
    }else if(sectionDef.id === 'foyer'){
      title = (lang==='en'?'Foyer discussion':'Φουαγιέ – συζήτηση');
    }else{
      title = sectionDef.id;
    }

    const h = document.createElement('h2');
    h.textContent = title;
    container.appendChild(h);

    if(!Array.isArray(sectionDef.blocks)) return;

    const actMap = {
      act1: dialogs.act1 || [],
      act2: dialogs.act2 || [],
      foyer: dialogs.foyer || []
    };

    sectionDef.blocks.forEach(block=>{
      if(block.type === 'note'){
        const nb = document.createElement('div');
        nb.className='note-block';
        nb.innerHTML = block.html || '';
        container.appendChild(nb);
        return;
      }

      if(block.type === 'dialogs'){
        const src = String(block.source || '').toLowerCase();
        const arr = actMap[src] || [];
        const subset = sliceDialogs(arr, block.from ?? 0, block.to ?? -1);
        if(subset.length === 0) return;

        const table = document.createElement('table');
        table.className='dialogs-table';
        const tbody = document.createElement('tbody');
        table.appendChild(tbody);

        subset.forEach(ev=>{
          const tr = document.createElement('tr');
          const tdL = document.createElement('td');
          const tdR = document.createElement('td');
          tdL.className='left';
          tdR.className='right';

          const leftHtml = (ev.left || '').replace(/\n/g,'<br>');
          tdL.innerHTML = leftHtml;

          if(ev.right){
            tdR.textContent = ev.right;
          }else{
            tdR.textContent = '';
          }

          tr.appendChild(tdL);
          tr.appendChild(tdR);
          tbody.appendChild(tr);
        });

        container.appendChild(table);
        return;
      }

      // block.type "image" / "html" για μελλοντικά:
      if(block.type === 'html'){
        const div = document.createElement('div');
        div.className='note-block';
        div.innerHTML = block.html || '';
        container.appendChild(div);
      }
      if(block.type === 'image'){
        const div = document.createElement('div');
        div.style.margin = '10px 0';
        const img = document.createElement('img');
        img.src = block.src || '';
        img.alt = block.alt || '';
        img.style.maxWidth='100%';
        img.style.height='auto';
        div.appendChild(img);
        if(block.caption){
          const cap = document.createElement('div');
          cap.className='dim';
          cap.style.marginTop='2px';
          cap.textContent = block.caption;
          div.appendChild(cap);
        }
        container.appendChild(div);
      }
    });
  }

  async function bootstrap(){
    const dataNotice = document.getElementById('dataNotice');
    const paramHost  = document.getElementById('paramBoxHost');
    const txHost     = document.getElementById('txTableHost');

    const bookData   = safeGetBookData();
    if(!bookData){
      dataNotice.textContent = (lang==='en')
        ? 'No saved data from the performance. Open the stage, run the show and click on the Book button.'
        : 'Δεν βρέθηκαν αποθηκευμένα δεδομένα παράστασης. Άνοιξε τη σκηνή, τρέξε την παράσταση και πάτησε το κουμπί «Βιβλίο Παράστασης».';
    }else{
      dataNotice.textContent = (lang==='en')
        ? 'Live data successfully loaded from the performance.'
        : 'Τα ζωντανά δεδομένα της παράστασης φορτώθηκαν επιτυχώς.';
    }

    renderParams(paramHost, bookData);
    renderTxTable(txHost, bookData);

    // book.json + dialogs
    const [book, dialogs] = await Promise.all([
      loadJSON('book.json'),
      loadJSON(lang==='en' ? 'dialogs-en.json' : 'dialogs-gr.json')
    ]);

    const sectionsById = {};
    if(Array.isArray(book.sections)){
      book.sections.forEach(sec=>{
        if(sec && sec.id) sectionsById[sec.id] = sec;
      });
    }

    renderSection(
      document.getElementById('section-act1'),
      sectionsById['act1'],
      dialogs
    );
    renderSection(
      document.getElementById('section-act2'),
      sectionsById['act2'],
      dialogs
    );
    renderSection(
      document.getElementById('section-foyer'),
      sectionsById['foyer'],
      dialogs
    );
  }

  bootstrap().catch(err=>{
    console.error(err);
    const dataNotice = document.getElementById('dataNotice');
    dataNotice.textContent = (lang==='en'
      ? 'Error loading book data.'
      : 'Σφάλμα κατά τη φόρτωση του βιβλίου παράστασης.');
  });
})();
</script>
</body>
</html>
