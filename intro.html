<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Πρόγραμμα Παράστασης · Α.Α.Τ.</title>
  <style>
    :root{
      color-scheme: dark;
      --paper: rgba(248,247,242,.96);
      --paper-brd: rgba(0,0,0,.18);
      --ink: rgba(18,18,18,.95);
      --muted: rgba(18,18,18,.70);
      --shadow: 0 18px 70px rgba(0,0,0,.55);
    }
    html,body{height:100%;}
    body{
      margin:0;
      background: transparent;
      display:grid;
      place-items:center;
      font: 16px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .wrap{
      width:min(1040px, 94vw);
      height:min(92vh, 860px);
      display:grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      padding: 16px;
      box-sizing:border-box;
    }
    .banner{
      display:grid;
      place-items:center;
    }
    .banner img{
      width:min(1000px, 92vw);
      max-width:100%;
      height:auto;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,.45);
      background: rgba(255,255,255,.04);
    }
    .leaflet{
      width:min(1000px, 92vw);
      margin:0 auto;
      background: var(--paper);
      border: 1px solid var(--paper-brd);
      border-radius: 12px;
      box-shadow: 0 12px 50px rgba(0,0,0,.25);
      overflow:auto;
      padding: 16px 18px 18px;
      box-sizing:border-box;
      color: var(--ink);
    }
    .leaflet .meta{
      font: 13px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--muted);
      margin: 0 0 10px;
    }
    .leaflet .content{
      font: 15.5px/1.7 ui-serif, Georgia, "Times New Roman", serif;
      text-align: justify;
      hyphens: auto;
      -webkit-hyphens: auto;
      white-space: normal;
    }
    .leaflet p{
      margin: 0 0 10px;
    }
    .leaflet hr{
      border: 0;
      border-top: 1px dashed rgba(0,0,0,.25);
      margin: 14px 0;
    }
    .leaflet ul{
      margin: 6px 0 10px 22px;
      padding: 0;
    }
    .leaflet li{
      margin: 2px 0;
    }
    .leaflet .mono{
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      color: var(--muted);
    }
  

/* AAT INTRO BG MATCH */
:root{ --intro-bg-url: none; }
#introBg{
  position: fixed;
  inset: 0;
  background-image: var(--intro-bg-url);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  transform: scale(1.08);
  filter: blur(18px) saturate(1.12);
  opacity: .85;
  z-index: 0;
  pointer-events: none;
}
#introBg::after{
  content:"";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 50% 25%, rgba(0,0,0,.15) 0%, rgba(0,0,0,.85) 70%),
    linear-gradient(180deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,.85) 100%);
}
body{
  background: #000;
}
.wrap{
  position: relative;
  z-index: 2;
}
</style>
</head>
<body>
  <div id="introBg" aria-hidden="true"></div>
  <div class="wrap" role="document" aria-label="Πρόγραμμα παράστασης Α.Α.Τ.">
    <div class="banner">
      <img id="poster" src="intro-poster.jpg" alt="Πρόγραμμα παράστασης Α.Α.Τ." />
    </div>

    <div class="leaflet">
      <div class="meta">Πρόγραμμα παράστασης</div>
      <div class="content" id="leafletContent" aria-label="Κείμενο προγράμματος"></div>
    </div>
  </div>

<script>
(function(){
  function esc(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function buildHtmlFromText(raw){
    // Στόχος: καλύτερη τυπογραφία χωρίς να "πειράξουμε" το κείμενο.
    // Μετατρέπουμε κενές γραμμές -> παραγράφους.
    // Ειδικές γραμμές-δείκτες bullets (•//o) -> λίστες.
    const lines = raw.split(/\r?\n/);
    const out = [];
    let p = [];
    let ul = null;
    let ul2 = null;
    let lastLiOpen = false;
    let expectBullet = 0; // 0 none, 1 top, 2 sub

    function flushParagraph(){
      if (!p.length) return;
      const txt = p.join(' ').replace(/\s+/g,' ').trim();
      if (txt) out.push('<p>' + esc(txt) + '</p>');
      p = [];
    }
    function closeLists(){
      if (ul2){ out.push('</ul>'); ul2=null; }
      if (ul){ out.push('</ul>'); ul=null; }
      lastLiOpen = false;
      expectBullet = 0;
    }
    function ensureUl(){
      if (!ul){ flushParagraph(); ul=true; out.push('<ul>'); }
    }
    function ensureUl2(){
      if (!ul2){
        // υπολίστα μέσα στο τελευταίο li
        if (!lastLiOpen){
          ensureUl();
          out.push('<li>' + esc('') );
          lastLiOpen = true;
        }
        out.push('<ul>');
        ul2 = true;
      }
    }
    function closeLiIfOpen(){
      if (lastLiOpen){
        out.push('</li>');
        lastLiOpen = false;
      }
    }

    const BUL1 = new Set(['•','','\uf0b7']);
    const BUL2 = new Set(['o','ο']); // σε περίπτωση που βγει ελληνικό ο

    for (let i=0;i<lines.length;i++){
      const rawLine = lines[i];
      const line = rawLine.trim();

      if (!line){
        // κενή γραμμή: κλείνουμε paragraph ή λίστα-γραμμή, αφήνουμε ανάσα
        flushParagraph();
        // δεν κλείνουμε οπωσδήποτε λίστες, γιατί στο raw μπορεί να έχει κενές ανάμεσα σε bullets
        continue;
      }

      if (BUL1.has(line)){
        // νέο top-level bullet ξεκινά
        flushParagraph();
        ensureUl();
        // κλείσε τυχόν υπολίστα και li
        if (ul2){ out.push('</ul>'); ul2=null; }
        closeLiIfOpen();
        expectBullet = 1;
        continue;
      }

      if (BUL2.has(line)){
        flushParagraph();
        ensureUl();
        // sub bullet
        ensureUl2();
        closeLiIfOpen();
        expectBullet = 2;
        continue;
      }

      // Κανονικό κείμενο
      if (expectBullet === 1){
        ensureUl();
        out.push('<li>' + esc(rawLine.trim()));
        lastLiOpen = true;
        expectBullet = 0;
        continue;
      }
      if (expectBullet === 2){
        ensureUl2();
        out.push('<li>' + esc(rawLine.trim()) + '</li>');
        expectBullet = 0;
        continue;
      }

      // Αν είμαστε μέσα σε li (top-level) και έρχεται συνέχεια γραμμής, την κάνουμε νέο line μέσα στο ίδιο li
      if (lastLiOpen && ul && !ul2){
        out[out.length-1] += '<br>' + esc(rawLine.trim());
      } else {
        // κανονική παράγραφος
        p.push(rawLine.trim());
      }
    }

    flushParagraph();
    // κλείσιμο ανοιχτών li/lists
    if (ul2){ out.push('</ul>'); ul2=null; }
    closeLiIfOpen();
    if (ul){ out.push('</ul>'); ul=null; }

    return out.join('\n');
  }

  async function init(){
    try{
      const r = await fetch('intro.json', { cache: 'no-cache' });
      const cfg = r.ok ? await r.json() : null;
      if (!cfg) return;

      const img = document.getElementById('poster');
      if (cfg.posterSrc) img.src = cfg.posterSrc;
      if (cfg.posterSrc) document.documentElement.style.setProperty('--intro-bg-url', `url("${cfg.posterSrc}")`);
      if (cfg.posterAlt) img.alt = cfg.posterAlt;

      const cont = document.getElementById('leafletContent');
      const txt = cfg.leafletText || '';
      cont.innerHTML = buildHtmlFromText(txt);
    }catch(e){
      // αν κάτι πάει στραβά, μένουμε απλά με την εικόνα
      const cont = document.getElementById('leafletContent');
      cont.innerHTML = '<p class="mono">Αποτυχία φόρτωσης intro.json</p>';
    }
  }

  init();
})();
</script>
</body>
</html>
